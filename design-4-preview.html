<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jylli Tool 4.0 prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Jylli Tool 4.0 "Through the glass": clickable vertical slice (see UI_4_0_PLAN.md). Serve the repo root: node tools/ui-preview/serve.js, open /design-4-preview.html.
     The 3D rig is the real twin; every number here is SIMULATED and labelled so. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<style>
:root {
  --bg: #07070A; --t1: #EDEDF0; --t2: rgba(237,237,240,.74); --t3: rgba(237,237,240,.54);
  --acc: #8B7CF6; --acc-rgb: 139,124,246; --acc-text: #B9AFFB;
  --ok: #3DD68C; --warn: #F5A524; --bad: #F2555A; --info: #4C9EFF;
  --spring: cubic-bezier(.16,1,.3,1); --glide: 640ms;
  --lx: 400px; --ly: 120px;
  --font: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--t1); font: 13px/1.45 var(--font); letter-spacing: -.003em; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* ── stage ───────────────────────────────────────────────────────────── */
#stage { position: fixed; inset: 0; background: radial-gradient(ellipse 70% 60% at 40% 58%, rgba(var(--acc-rgb), .17), transparent 70%), radial-gradient(ellipse at 50% 120%, #14141c, var(--bg) 60%); overflow: hidden; }
#slot, #netslot { position: absolute; top: 0; bottom: 0; left: -130px; right: 130px; transition: opacity var(--glide) var(--spring), transform var(--glide) var(--spring), filter var(--glide) var(--spring); }
#slot canvas, #netslot canvas { width: 100% !important; height: 100% !important; display: block; }
#netslot { left: 84px; right: 464px; opacity: 0; transform: scale(.92); pointer-events: none; }
#netslot canvas { filter: brightness(2.6) contrast(1.25) saturate(1.4); }   /* the net scene is lit for the 2D hero; lift it for the full-bleed stage */
body.net #slot { opacity: 0; transform: scale(1.18); filter: blur(6px); pointer-events: none; }
body.net #netslot { opacity: 1; transform: none; pointer-events: auto; }
#slot .j-twin-hint, #slot .j-twin-fallback { display: none; }
#grain { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
#sweep { position: fixed; top: 0; bottom: 0; width: 160px; left: -200px; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(var(--acc-rgb), .22), rgba(255,255,255,.28) 50%, rgba(var(--acc-rgb), .22), transparent); filter: blur(2px); opacity: 0; }
#sweep.go { animation: sweep 2.4s cubic-bezier(.5,0,.5,1) forwards; }
@keyframes sweep { 0% { left: -200px; opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { left: 100%; opacity: 0 } }
body.gaming-live #grain { background: #000; opacity: .0; }

/* ── glass material: shared light via --mx/--my set per element from the one light ── */
.glass { position: relative; border-radius: 18px; background: linear-gradient(180deg, rgba(34,34,42,.58), rgba(14,14,19,.74)); backdrop-filter: blur(24px) saturate(1.5) brightness(.9); -webkit-backdrop-filter: blur(24px) saturate(1.5) brightness(.9); box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(255,255,255,.035), inset 0 0 40px var(--heat, transparent); --mx: 50%; --my: 0%; }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: radial-gradient(320px circle at var(--mx) var(--my), rgba(255,255,255,.62), rgba(255,255,255,.10) 55%, rgba(255,255,255,.04)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(380px circle at var(--mx) var(--my), rgba(255,255,255,.07), transparent 65%); }
body.q-light .glass, body.q-classic .glass { backdrop-filter: none; -webkit-backdrop-filter: none; background: linear-gradient(180deg, rgba(28,28,34,.94), rgba(16,16,21,.97)); }
body.q-cinematic .glass { backdrop-filter: blur(36px) saturate(1.8) brightness(.85); -webkit-backdrop-filter: blur(36px) saturate(1.8) brightness(.85); }
body.q-classic #stage { display: none; }
body.q-classic { background: #0b0b0e; }
body.q-classic #leaders, body.q-classic .callout { display: none; }

/* ── chrome ──────────────────────────────────────────────────────────── */
#topbar { position: fixed; top: 10px; left: 88px; right: 16px; height: 36px; display: flex; align-items: center; gap: 12px; z-index: 5; }
#topbar .brand { font-weight: 600; letter-spacing: -.02em; font-size: 14px; display: flex; align-items: center; gap: 8px; }
#topbar .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 14px 2px rgba(var(--acc-rgb), .8); }
.pill { font-size: 11.5px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.06); color: var(--t2); border: 1px solid rgba(255,255,255,.08); }
.pill.demo { color: var(--warn); border-color: rgba(245,165,36,.3); background: rgba(245,165,36,.08); }
.sp { flex: 1; }
.kbd { font: 11px var(--mono); padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,.07); color: var(--t2); border: 1px solid rgba(255,255,255,.08); }
#search { display: flex; gap: 8px; align-items: center; height: 32px; padding: 0 8px 0 12px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); color: var(--t3); }
#search:hover { background: rgba(255,255,255,.08); color: var(--t2); }

#rail { position: fixed; left: 12px; top: 56px; bottom: 124px; width: 60px; z-index: 6; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; border-radius: 20px; overflow: hidden; transition: width 320ms var(--spring); }
#rail:hover, #rail:focus-within { width: 176px; }
#rail button { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--t3); white-space: nowrap; text-align: left; position: relative; transition: background 160ms, color 160ms; }
#rail button:hover { background: rgba(255,255,255,.06); color: var(--t1); }
#rail button.on { background: rgba(var(--acc-rgb), .16); color: #fff; }
#rail button.on::before { content: ''; position: absolute; left: -9px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--acc); box-shadow: 0 0 12px var(--acc); }
#rail svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#rail span { opacity: 0; transition: opacity 200ms; font-weight: 500; }
#rail:hover span, #rail:focus-within span { opacity: 1; }
#rail .gap { flex: 1; }
#rail kbd { margin-left: auto; font: 10.5px var(--mono); opacity: 0; color: var(--t3); }
#rail:hover kbd { opacity: 1; }

#plate { position: fixed; right: 16px; top: 56px; bottom: 124px; width: 440px; z-index: 4; padding: 22px 22px 20px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; transition: opacity 220ms var(--spring), transform 220ms var(--spring); }
#plate.out { opacity: 0; transform: translateX(26px) scale(.985); }
#plate.in { animation: plateIn 520ms var(--spring); }
@keyframes plateIn { from { opacity: 0; transform: translateX(34px) scale(.985); } }
body.gaming-live #plate { opacity: .96; }
.crumb { color: var(--t3); font-size: 12px; margin-bottom: 2px; }
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.sub { color: var(--t2); margin: 0 0 16px; font-size: 13px; }
.tabs { display: flex; gap: 4px; padding: 3px; background: rgba(255,255,255,.05); border-radius: 11px; margin-bottom: 16px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 7px 0; border-radius: 8px; color: var(--t2); font-weight: 500; }
.tabs button.on { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.hero { display: flex; align-items: flex-end; gap: 6px; margin: 4px 0 2px; }
.hero .stat .odo { font-size: 68px; letter-spacing: -.04em; font-weight: 600; }
.hero .stat { gap: 6px; }
.hero .stat small { font-size: 20px; color: var(--t3); }
.callout { background: linear-gradient(180deg, rgba(28,28,38,.86), rgba(12,12,18,.92)); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.cell { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); }
.cell label { display: block; color: var(--t3); font-size: 12px; margin-bottom: 2px; }
.stat { display: inline-flex; align-items: baseline; gap: 3px; }
.stat .odo { font-size: 22px; font-weight: 600; letter-spacing: -.03em; }
.stat small { color: var(--t3); font-family: var(--mono); font-size: 12px; }
.odo { font-family: var(--mono); font-feature-settings: 'tnum'; display: inline-flex; line-height: 1; height: 1em; overflow: hidden; vertical-align: baseline; }
.od-c { display: inline-block; height: 1em; overflow: hidden; }
.od-c[data-d] { width: .62em; text-align: center; }
.od-c i { display: block; font-style: normal; line-height: 1; transition: transform 640ms cubic-bezier(.2,.9,.25,1.08); }
body.mr .od-c i, body.mr * { transition-duration: 0ms !important; animation-duration: 0ms !important; }
.odo.pending { animation: shimmer 1s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .35; } }
[data-src] { cursor: help; }
[data-src]:hover { text-decoration: underline dotted rgba(255,255,255,.4); text-underline-offset: 5px; }
.bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, rgba(var(--acc-rgb), .7), var(--acc)); transition: width 700ms var(--spring); box-shadow: 0 0 14px rgba(var(--acc-rgb), .6); }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.06); }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.off { background: var(--t3); }
.muted { color: var(--t3); font-size: 12px; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: rgba(61,214,140,.12); color: var(--ok); }
.badge.rec { background: rgba(245,165,36,.14); color: var(--warn); }
.lbl { font-size: 12px; color: var(--t3); margin: 18px 0 6px; font-weight: 500; }

.btn { height: 38px; padding: 0 16px; border-radius: 11px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.07); font-weight: 500; transition: background 140ms, transform 140ms; }
.btn:hover { background: rgba(255,255,255,.12); }
.btn:active { transform: scale(.985); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px; }
.hold { --p: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 48px; border-radius: 13px; border: 1px solid rgba(var(--acc-rgb), .55); background: rgba(var(--acc-rgb), .16); color: #fff; font-weight: 600; font-size: 14px; user-select: none; box-shadow: 0 10px 30px -10px rgba(var(--acc-rgb), .65), inset 0 1px 0 rgba(255,255,255,.15); }
.hold::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--acc-rgb), .9), var(--acc)); transform-origin: left; transform: scaleX(var(--p)); }
.hold > * { position: relative; }
.hold.holding { transform: scale(.99); }
.hold:disabled { opacity: .45; cursor: default; box-shadow: none; }
.hold .ring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#fff calc(var(--p) * 360deg), rgba(255,255,255,.25) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
input[type=range] { width: 100%; accent-color: var(--acc); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { padding: 6px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04); color: var(--t2); }
.seg button.on { background: rgba(var(--acc-rgb), .2); border-color: rgba(var(--acc-rgb), .55); color: #fff; }
.replaybadge { display: none; align-items: center; gap: 8px; margin-bottom: 12px; padding: 7px 12px; border-radius: 10px; background: rgba(76,158,255,.12); color: #9CC8FF; border: 1px solid rgba(76,158,255,.3); font-size: 12.5px; }
body.replay .replaybadge { display: flex; }
.ring-wrap { display: flex; align-items: center; gap: 18px; margin: 6px 0 16px; }
.score { position: relative; width: 104px; height: 104px; flex: none; }
.score svg { width: 104px; height: 104px; transform: rotate(-90deg); }
.score circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.score .tr { stroke: rgba(255,255,255,.08); }
.score .fg { stroke: var(--acc); filter: drop-shadow(0 0 6px rgba(var(--acc-rgb), .8)); transition: stroke-dashoffset 1s var(--spring); }
.score .odo { position: absolute; inset: 0; margin: auto; font-size: 30px; font-weight: 600; justify-content: center; align-items: center; height: 1em; width: max-content; }

/* callouts + leaders */
#leaders, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
#fx { z-index: 9; }
.callout { position: fixed; left: 0; top: 0; z-index: 3; min-width: 168px; padding: 10px 14px 11px; border-radius: 14px; pointer-events: auto; will-change: transform; transition: opacity 300ms; }
.callout.hide { opacity: 0; pointer-events: none; }
.callout h4 { margin: 0 0 4px; font-size: 12px; font-weight: 500; color: var(--t2); display: flex; align-items: center; gap: 6px; }
.callout .ms { display: flex; gap: 16px; }
.callout .stat .odo { font-size: 20px; }
.callout .sub2 { color: var(--t3); font-size: 11.5px; margin-top: 3px; }

#chrono { position: fixed; left: 88px; right: 16px; bottom: 12px; height: 100px; z-index: 5; padding: 10px 16px 10px; }
.ch-head { display: flex; align-items: center; gap: 12px; height: 22px; font-size: 12px; }
.ch-head b { font-weight: 600; }
.ch-head .leg { color: var(--t3); display: flex; gap: 12px; align-items: center; }
.ch-head .leg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -0px; }
#ch-track { position: absolute; left: 16px; right: 16px; top: 36px; bottom: 10px; cursor: ew-resize; touch-action: none; }
#ch-track svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ch-sess { position: absolute; bottom: 0; height: 7px; border-radius: 4px; background: rgba(61,214,140,.55); }
.ch-sess:hover { background: var(--ok); }
.ch-mark { position: absolute; top: 2px; width: 12px; height: 12px; margin-left: -6px; background: var(--acc); transform: rotate(45deg); border-radius: 3px; box-shadow: 0 0 12px rgba(var(--acc-rgb), .9); border: 0; padding: 0; }
.ch-mark.new { animation: markIn 700ms var(--spring); }
@keyframes markIn { from { transform: rotate(45deg) scale(0); } }
.ch-mark.gone { transition: all 500ms; opacity: 0; transform: rotate(45deg) scale(0); }
.ch-day { position: absolute; bottom: -2px; font-size: 10.5px; color: var(--t3); transform: translateX(-50%); white-space: nowrap; }
.ch-day::before { content: ''; position: absolute; left: 50%; bottom: 14px; height: 6px; width: 1px; background: rgba(255,255,255,.12); }
#ch-head { position: absolute; top: -4px; bottom: 6px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.7); border-radius: 2px; pointer-events: none; }
#ch-head::after { content: attr(data-t); position: absolute; top: -4px; left: 50%; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #fff; color: #111; font-weight: 600; }
#ch-pop { position: fixed; z-index: 12; padding: 12px 14px; width: 250px; display: none; }
#ch-pop.show { display: block; animation: plateIn 300ms var(--spring); }

#prov { position: fixed; z-index: 30; pointer-events: none; padding: 6px 10px; border-radius: 9px; font-size: 11.5px; background: rgba(240,240,246,.96); color: #15151a; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); transition: opacity 120ms, transform 120ms; max-width: 280px; }
#prov.show { opacity: 1; transform: none; }
#prov b { display: block; font-weight: 600; } #prov span { color: #66666f; }
#toast { position: fixed; left: 50%; bottom: 124px; transform: translate(-50%, 20px); z-index: 20; padding: 10px 16px; border-radius: 12px; display: flex; align-items: center; gap: 14px; opacity: 0; pointer-events: none; transition: all 360ms var(--spring); }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { border: 0; background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 7px; font-weight: 600; }

#palette { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; background: rgba(4,4,8,.55); backdrop-filter: blur(6px); }
#palette.show { display: flex; animation: fade 200ms; }
@keyframes fade { from { opacity: 0 } }
#palette .box { width: min(640px, 92vw); padding: 10px; }
#palette input { width: 100%; height: 52px; padding: 0 16px; font: 17px var(--font); color: #fff; background: transparent; border: 0; outline: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
#palette ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
#palette li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 11px; color: var(--t2); cursor: pointer; }
#palette li.on { background: rgba(var(--acc-rgb), .2); color: #fff; }
#palette li em { font-style: normal; margin-left: auto; font-size: 11.5px; color: var(--t3); }
#palette li .chip { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
#intro { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; pointer-events: none; transition: opacity 800ms; color: var(--t2); }
#intro b { display: block; font-size: 26px; letter-spacing: -.03em; color: #fff; }
#paused { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 7; padding: 10px 18px; border-radius: 14px; display: none; text-align: center; }
body.gaming-live #paused { display: block; }
#sharecard { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,.1); }
/* Windows tweaks page: wide plate, rows, dock, review sheet */
#plate.wide { width: 700px; }
body.wide #slot { left: -270px; right: 270px; }
.tw-tools { display: flex; gap: 8px; margin: 2px 0 10px; }
.tw-tools input { flex: 1; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: #fff; font: 13px var(--font); }
.tw-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tw-chips button { padding: 5px 11px; border-radius: 99px; border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04); color: var(--t2); font-size: 12px; }
.tw-chips button.on { background: rgba(var(--acc-rgb), .22); border-color: rgba(var(--acc-rgb), .6); color: #fff; }
.tw-chips button b { font-weight: 500; color: var(--t3); margin-left: 4px; }
.tw-g { margin: 16px 2px 4px; font-size: 12px; color: var(--t3); font-weight: 500; display: flex; gap: 8px; }
.tw { display: flex; align-items: flex-start; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 13px; border: 1px solid transparent; position: relative; transition: background 160ms, border-color 160ms; }
.tw:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.07); }
.tw.staged { background: rgba(var(--acc-rgb), .09); border-color: rgba(var(--acc-rgb), .35); }
.tw.staged::before { content: ''; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
.tw-b { flex: 1; min-width: 0; }
.tw-t { font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge.st { background: rgba(var(--acc-rgb), .2); color: var(--acc-text); }
.badge.adv { background: rgba(242,85,90,.14); color: #FF8E92; }
.sw { flex: none; width: 38px; height: 22px; margin-top: 1px; border-radius: 99px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.08); position: relative; padding: 0; transition: background 200ms, box-shadow 200ms; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #cfcfd8; transition: transform 260ms var(--spring), background 200ms; }
.sw[aria-checked=true] { background: var(--acc); border-color: transparent; box-shadow: 0 0 14px rgba(var(--acc-rgb), .6); }
.sw[aria-checked=true]::after { transform: translateX(16px); background: #fff; }
.tw-x { flex: none; width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: var(--t3); transition: transform 220ms var(--spring), background 140ms; }
.tw-x:hover { background: rgba(255,255,255,.08); color: #fff; }
.tw-x[aria-expanded=true] { transform: rotate(90deg); }
.tw-c { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.05); }
.tc { display: flex; gap: 8px; align-items: baseline; font-size: 11.5px; padding: 3px 0; }
.tc i { font-style: normal; font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.08); color: var(--t2); flex: none; }
.tc code { font: 11px var(--mono); color: var(--t2); overflow-wrap: anywhere; flex: 1; }

function shot(id) { prog++; if (id) JylliTwin.select(id); else JylliTwin.back(); prog-- }

/* ───────── apply as a physical event ───────── */
let undoFn = null, toastT

$('#toast-b').onclick = () => { if (undoFn) undoFn(); $('#toast').classList.remove('show') }

}
function openPop(ch) {

function undoMark(ch) {

/* ───────── speed-test flight ───────── */
function runSpeed() {
  const b = $('#speed'); if (!b || b.disabled) return; b.disabled = true; b.textContent = 'Testing…'
  S.speed = null; let t0 = performance.now()
  const rate = (rx, tx) => netScene && netScene.setTraffic([{ rx: rx * 125000, tx: tx * 125000 }])
  const iv = setInterval(() => {
    const p = clamp((performance.now() - t0) / 3200, 0, 1)
    S.speed = { down: 482 * Math.pow(p, .6) + Math.random() * 6, up: 94 * Math.pow(p, .7) + Math.random() * 2, ping: 38 - p * 25 + Math.random() }
    rate(S.speed.down, S.speed.up); beep(300 + p * 600, .03, 'sine', .015)
    if (p >= 1) { clearInterval(iv); S.speed = { down: 482, up: 94, ping: 11 }; rate(40, 8); renderPlate(); toast('Speed test finished · 482 Mbps down, 11 ms') }
  }, 90)
}

/* ───────── system scan sweep ───────── */
function runScan() {
  const b = $('#scan'); b.disabled = true; b.textContent = 'Scanning…'

  const sw = $('#sweep'); sw.classList.remove('go'); void sw.offsetWidth; sw.classList.add('go')
  const ids = ['cpu', 'cooler', 'ram0', 'gpu', 'drive0', 'board']
  ids.forEach((id, i) => setTimeout(() => {
    JylliTwin.pulse(id); const r = $('#chk' + i); if (r) { r.querySelector('.dot').className = 'dot'; r.querySelector('.muted').textContent = 'OK' }; beep(500 + i * 90, .05, 'sine', .04)
    if (i === 5) { S.scanned = new Date().toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' }); setTimeout(() => { if (S.view === 'system') renderPlate(); toast('Diagnostics finished · all 6 parts OK') }, 500) }
  }, 450 + i * 320))
}

function drawShare() {
  const c = $('#sharecard'), x = c.getContext('2d'), W = 1200, H = 630
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#1b1230'); g.addColorStop(.55, '#0d0d16'); g.addColorStop(1, '#2a1410'); x.fillStyle = g; x.fillRect(0, 0, W, H)
  const r = x.createRadialGradient(920, 120, 10, 920, 120, 520); r.addColorStop(0, 'rgba(245,140,60,.45)'); r.addColorStop(1, 'transparent'); x.fillStyle = r; x.fillRect(0, 0, W, H)
  x.fillStyle = '#fff'; x.font = '600 56px Geist, sans-serif'; x.fillText('Forza Horizon 5', 64, 120)

  x.beginPath(); const r2 = rng(3); x.moveTo(64, 540)
  for (let i = 0; i <= 80; i++) x.lineTo(64 + i * 14.2, 520 - Math.abs(Math.sin(i * .21)) * 24 - r2() * 18 - (i % 23 === 0 ? 40 : 0))

}

/* ───────── chronoline ───────── */
function buildChrono() {
  const tr = $('#ch-track'); tr.innerHTML = ''
  const pts = hist.map((h, i) => `${(i / (N - 1) * 1000).toFixed(1)},${(46 - (h.gpuT - 30) / 60 * 40).toFixed(1)}`).join(' ')
  tr.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 1000 50" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C9EFF" stop-opacity=".35"/><stop offset="1" stop-color="#4C9EFF" stop-opacity="0"/></linearGradient></defs><polyline points="0,50 ${pts} 1000,50" fill="url(#cg)" stroke="none"/><polyline points="${pts}" fill="none" stroke="#4C9EFF" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`)
  SESSIONS.forEach(s => { const d = document.createElement('div'); d.className = 'ch-sess'; d.style.left = s[0] / (N - 1) * 100 + '%'; d.style.width = (s[1] - s[0]) / (N - 1) * 100 + '%'; d.title = s[2]; d.dataset.src = s[2] + '|Session recorder'; d.onpointerdown = e => e.stopPropagation(); d.onclick = e => { e.stopPropagation(); toast(s[2] + ' · opens its Replay') }; tr.append(d) })
  for (let d = 0; d < 7; d++) { const i = N - 1 - d * 24 - (new Date().getHours()); const el = document.createElement('div'); el.className = 'ch-day'; const dt = new Date(NOW - d * 864e5); el.textContent = d === 0 ? 'Today' : dt.toLocaleDateString('en', { weekday: 'short' }); el.style.left = (i - 12 + 24 * 0) / (N - 1) * 100 + '%'; if (i > 6) tr.append(el) }
  CHANGES.forEach(addMark)
  const head = document.createElement('div'); head.id = 'ch-head'; head.dataset.t = 'Now'; head.style.left = '100%'; tr.append(head)
}
function setReplay(i) {
  S.replay = i
  document.body.classList.toggle('replay', i != null)
  const head = $('#ch-head'); head.style.left = (i == null ? 100 : i / (N - 1) * 100) + '%'; head.dataset.t = i == null ? 'Now' : timeLabel(i)
  $('#ch-state').textContent = i == null ? 'Live · drag to rewind your PC' : 'Replaying recorded history · numbers are from the past'

}
{
  const tr = $('#ch-track'); let dragging = false
  const at = e => { const r = tr.getBoundingClientRect(), f = clamp((e.clientX - r.left) / r.width, 0, 1); setReplay(f > .985 ? null : Math.round(f * (N - 1))) }

  $('#ch-live').onclick = () => setReplay(null)

/* ───────── rail ───────── */
const ICON = { home: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z', optimize: 'M12 14l4-4M3.34 19a10 10 0 1 1 17.32 0', gaming: 'M6 11h4M8 9v4M15 12h.01M18 10h.01M17.32 5H6.68a4 4 0 0 0-3.98 3.59L2 18a2 2 0 0 0 3.5 1.5L8 17h8l2.5 2.5A2 2 0 0 0 22 18l-.7-9.4A4 4 0 0 0 17.32 5z', clean: 'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14', system: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1' }

/* ───────── command palette (symptoms, not just pages) ───────── */
const CMDS = [
  ['Home', 'Overview', () => go('home'), 'home overview health score', ''],
  ['Windows tweaks', 'Optimize', () => go('optimize', 'win'), 'windows tweaks game dvr telemetry latency mmcss privacy hibernate sysmain input mouse', ''],
  ['Graphics card', 'Optimize',() => go('optimize', 'gpu'), 'gpu graphics card temperature power limit fps', 'gpu'],
  ['Processor', 'Optimize', () => go('optimize', 'cpu'), 'cpu processor power plan clock', 'cpu'],
  ['Memory', 'Optimize', () => go('optimize', 'ram'), 'ram memory standby free', 'ram'],
  ['Network and speed test', 'Optimize', () => go('optimize', 'net'), 'network ping internet speed lag latency', 'net'],
  ['Free disk space', 'Clean', () => go('clean'), 'clean disk space storage junk temp cache', 'drive'],
  ['Game mode and Replay', 'Gaming', () => go('gaming'), 'game gaming replay session recap share', ''],

let pi = 0, pres = []
const pal = $('#palette'), pq = $('#pq'), pl = $('#pl')
function openPal() { pal.classList.add('show'); pq.value = ''; pq.focus(); fillPal() }
function closePal() { pal.classList.remove('show') }
function fillPal() {
  const q = pq.value.trim().toLowerCase().split(/\s+/).filter(Boolean)
  pres = CMDS.filter(c => q.every(w => (c[0] + ' ' + c[3]).toLowerCase().includes(w))).slice(0, 8); pi = 0
  pl.innerHTML = pres.map((c, i) => `<li class="${i ? '' : 'on'}" data-i="${i}"><span class="chip"></span>${c[0]}<em>${c[1]}</em></li>`).join('') || '<li>No match. In the app this searches every tweak.</li>'
  $$('li[data-i]', pl).forEach(li => li.onclick = () => run(+li.dataset.i))
}
function run(i) { const c = pres[i]; if (!c) return; closePal(); c[2]() }
pq.oninput = fillPal
pq.onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pi = clamp(pi + (e.key === 'ArrowDown' ? 1 : -1), 0, pres.length - 1); $$('li', pl).forEach((l, i) => l.classList.toggle('on', i === pi)) }
  else if (e.key === 'Enter') run(pi); else if (e.key === 'Escape') closePal()
}
pal.onclick = e => { if (e.target === pal) closePal() }
$('#search').onclick = openPal
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return }
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return
  const k = '123456'.indexOf(e.key); if (k >= 0 && !e.ctrlKey) { const n = NAV.filter(x => x[0] !== 'gap')[k]; if (n) go(n[0]) }
  if (e.key === 'Escape') go('home')
})

/* ───────── world: engine, network scene, assembly ───────── */
async function ensureNet() {
  if (netScene || ensureNet.p) return
  ensureNet.p = true
  try {
    netScene = await JylliTwinNet.create($('#netslot'), { accent: [0.55, 0.49, 0.96] })
    if (netScene) { $('#netslot').classList.add('j-twin-live'); const rs = () => { const r = $('#netslot').getBoundingClientRect(); netScene.resize(Math.round(r.width), Math.round(r.height), devicePixelRatio || 1) }; rs(); addEventListener('resize', rs); netScene.setTraffic([{ rx: 40e3, tx: 10e3 }]) }
  } catch (e) { console.warn('net scene', e) }
}
function runAssembly() {
  const intro = $('#intro'); intro.style.opacity = 1
  document.body.style.setProperty('--pl', 0)
  JylliTwin.assemble({ reduced: S.motion === 'reduced' }).then(() => { intro.style.opacity = 0 })
  setTimeout(() => { intro.style.opacity = 0 }, 3200)
}
JylliTwin.on('select', id => {
  if (prog || !id) return
  const map = { cpu: ['optimize', 'cpu'], cooler: ['optimize', 'cpu'], gpu: ['optimize', 'gpu'], ram0: ['optimize', 'ram'], ram1: ['optimize', 'ram'], drive0: ['clean'], board: ['system'] }
  const m = map[id] || null
  if (m) go(m[0], m[1])
})
JylliTwin.attach($('#slot'))

/* ───────── main loop ───────── */
let last = performance.now(), acc = 0
function frame(now) {
  requestAnimationFrame(frame)
  const dt = Math.min((now - last) / 1000, .1); last = now
  if (S.gameLive) { return }
  acc += dt
  if (acc > .25) { acc = 0; simulate(.25); pushTelemetry(); refreshNumbers(); if (S.view === 'optimize' && S.optTab === 'ram') { const b = $('#rambar'); if (b) b.style.width = V['ram.pct'] + '%' } }
  updateCallouts(); updateLight(now)
  if (S.view === 'home') { const f = $('#ring'); if (f) f.style.strokeDashoffset = 289 * (1 - V.score / 100) }
}
simulate(0); pushTelemetry(); buildChrono(); buildCallouts(); $('#rail button[data-v=home]').classList.add('on'); renderPlate()
document.body.classList.add('mr-off')
// the plates arrive after the rig has assembled
plate.style.opacity = 0; $('#chrono').style.opacity = 0; $('#rail').style.opacity = 0
const showUI = () => { for (const el of [plate, $('#chrono'), $('#rail')]) { el.style.transition = 'opacity 900ms'; el.style.opacity = 1 } setTimeout(() => { for (const el of [plate, $('#chrono'), $('#rail')]) el.style.transition = '' }, 1000) }
const wait = setInterval(() => { if (JylliTwin.state === 'live' || JylliTwin.state === 'static') { clearInterval(wait); if (JylliTwin.state === 'live') { runAssembly(); setTimeout(showUI, 2600) } else { showUI(); $('#intro').style.opacity = 0 } } }, 150)
setTimeout(() => { if (!plate.style.opacity || plate.style.opacity === '0') showUI() }, 9000)
requestAnimationFrame(frame)
window.__p = { S, V, go, JylliTwin }
