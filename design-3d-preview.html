<style>
@font-face { font-family: 'Geist'; src: url('assets/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url('assets/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

/* ── Preview chrome (not part of the app) ── */
html, body { margin: 0; height: 100%; }
body { background: #1a1a1d; color: #d4d4d8; font: 12px/1.4 'Geist', 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
body.pv-light { background: #d9d9de; color: #3f3f46; }
.pv-bar { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid rgba(127,127,127,.2); overflow-x: auto; white-space: nowrap; }
.pv-group { display: flex; align-items: center; gap: 4px; }
.pv-group > span { opacity: .6; margin-right: 4px; }
.pv-btn { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(127,127,127,.28); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.pv-btn[aria-pressed="true"] { background: rgba(127,127,127,.22); border-color: rgba(127,127,127,.5); }
.pv-sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.pv-sw[aria-pressed="true"] { border-color: currentColor; }
.pv-bar input[type=range] { width: 110px; accent-color: #8B7CF6; }
.pv-stage { position: absolute; inset: 48px 0 0 0; display: grid; place-items: center; }
.pv-scaler { position: relative; }
.pv-scaler > .app { position: absolute; top: 0; left: 0; transform-origin: 0 0; box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.4); }

/* ── Tokens: dark (default) and light ── */
.app {
  --font: 'Geist', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --accent: #8B7CF6;
  --bg: #08080A; --panel: #0F0F11; --card: #141417; --raised: #1B1B1F; --s3: #232328;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.11); --line-3: rgba(255,255,255,.17);
  --hover: rgba(255,255,255,.04); --press: rgba(255,255,255,.07);
  --t1: #EDEDEF; --t2: #B4B4BC; --t3: #858590;
  --accent-text: color-mix(in oklab, var(--accent) 78%, white);
  --accent-solid: color-mix(in oklab, var(--accent) 80%, black);
  --accent-subtle: color-mix(in srgb, var(--accent) 14%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);
  --ok: #3DD68C; --warn: #F5A524; --danger: #F2555A; --info: #4C9EFF;
  --ok-bg: rgba(61,214,140,.12); --warn-bg: rgba(245,165,36,.12); --danger-bg: rgba(242,85,90,.12);
  --shadow-pop: 0 16px 48px rgba(0,0,0,.55), 0 0 0 1px var(--line-2);
  --top-hl: inset 0 1px 0 rgba(255,255,255,.035);
}
.app.light {
  --bg: #F1F1F3; --panel: #FFFFFF; --card: #FFFFFF; --raised: #F5F5F7; --s3: #EBEBEE;
  --line: rgba(0,0,0,.075); --line-2: rgba(0,0,0,.11); --line-3: rgba(0,0,0,.18);
  --hover: rgba(0,0,0,.035); --press: rgba(0,0,0,.06);
  --t1: #17171A; --t2: #4F4F58; --t3: #6E6E78;
  --accent-text: color-mix(in oklab, var(--accent) 72%, black);
  --accent-solid: color-mix(in oklab, var(--accent) 82%, black);
  --accent-subtle: color-mix(in srgb, var(--accent) 10%, transparent);
  --ok: #15803D; --warn: #B45309; --danger: #DC2626; --info: #2563EB;
  --ok-bg: rgba(21,128,61,.09); --warn-bg: rgba(180,83,9,.09); --danger-bg: rgba(220,38,38,.08);
  --shadow-pop: 0 18px 44px rgba(20,20,30,.14), 0 2px 6px rgba(20,20,30,.06), 0 0 0 1px var(--line-2);
  --top-hl: none;
}
/* The 3D stage is a dark display case in both schemes */
.stage { --raised: #1B1B1F; --s3: #232328; --panel: #0F0F11; --card: #141417; --t1: #EDEDEF; --t2: #B4B4BC; --t3: #9A9AA6; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.13); --line-3: rgba(255,255,255,.2); --hover: rgba(255,255,255,.05); --press: rgba(255,255,255,.08); --accent-text: color-mix(in oklab, var(--accent) 78%, white); color: var(--t1); }

/* ── Shell ── */
.app { position: relative; display: grid; grid-template-columns: 216px minmax(0,1fr); grid-template-rows: 40px minmax(0,1fr) 26px; background: var(--bg); color: var(--t1); font: 400 13px/1.45 var(--font); letter-spacing: -.003em; overflow: hidden; border-radius: 10px; -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01'; }
.app * { box-sizing: border-box; }
.app button { font: inherit; color: inherit; }
.app :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.i { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.tb { grid-column: 1 / -1; display: grid; grid-template-columns: 216px minmax(0,1fr) auto minmax(0,1fr) auto; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; padding-left: 16px; font-weight: 600; font-size: 13px; letter-spacing: -.01em; }
.mark { width: 20px; height: 20px; border-radius: 6px; background: var(--accent-solid); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.crumb { display: flex; gap: 6px; align-items: center; color: var(--t3); padding-left: 12px; min-width: 0; }
.crumb b { color: var(--t1); font-weight: 500; }
.search { width: 340px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line); color: var(--t3); cursor: pointer; text-align: left; }
.search:hover { border-color: var(--line-2); color: var(--t2); }
.search span { flex: 1; }
.kbd { font: 500 11px/1 var(--mono); color: var(--t3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--panel); }
.tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--t2); font-size: 12px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.acc { background: var(--accent); }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 6px; color: var(--t2); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--t1); }
.win { display: flex; height: 40px; margin-left: 6px; }
.win button { width: 46px; border: 0; background: transparent; color: var(--t2); display: grid; place-items: center; cursor: default; }
.win button:hover { background: var(--hover); }
.win button:last-child:hover { background: #E81123; color: #fff; }

.sb { display: flex; flex-direction: column; padding: 6px 8px 10px; gap: 1px; min-height: 0; }
.nav { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; border: 0; background: transparent; color: var(--t2); cursor: pointer; text-align: left; font-weight: 450; }
.nav:hover { background: var(--hover); color: var(--t1); }
.nav[aria-current="page"] { background: var(--press); color: var(--t1); }
.nav[aria-current="page"] .i { color: var(--accent-text); }
.nav .count { margin-left: auto; font: 500 11px var(--mono); color: var(--t3); }
.sb-spacer { flex: 1; }
.acct { display: flex; align-items: center; gap: 10px; padding: 12px 10px 8px; border-top: 1px solid var(--line); margin-top: 6px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.acct small { display: block; color: var(--t3); font-size: 11px; }

.main { position: relative; margin: 0 8px 0 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; min-height: 0; box-shadow: var(--top-hl); display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }
.head { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); padding: 20px 32px 0; border-bottom: 1px solid var(--line); flex: none; }
.head-row { display: flex; align-items: flex-start; gap: 16px; max-width: 1160px; margin: 0 auto; }
.head h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
.head p { margin: 4px 0 0; color: var(--t2); }
.tabs { display: flex; gap: 2px; max-width: 1160px; margin: 14px auto 0; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; height: 36px; padding: 0 10px; border: 0; background: transparent; color: var(--t2); cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 450; white-space: nowrap; }
.tab:hover { color: var(--t1); }
.tab[aria-selected="true"] { color: var(--t1); }
.tab[aria-selected="true"]::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.pro { font: 600 9.5px/1 var(--font); letter-spacing: .04em; color: var(--accent-text); border: 1px solid var(--accent-line); padding: 2px 4px; border-radius: 4px; text-transform: uppercase; }
.page { flex: 1 0 auto; width: 100%; max-width: 1160px; margin: 0 auto; padding: 20px 32px 24px; animation: enter .18s cubic-bezier(.16,1,.3,1); }
.page.noanim { animation: none; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } }
.st { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 16px; color: var(--t3); font-size: 11.5px; }
.st .num { color: var(--t2); }
.st .sep { width: 1px; height: 12px; background: var(--line-2); }
.st .grow { flex: 1; }

/* ── Primitives ── */
.btn { height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border-radius: 7px; border: 1px solid transparent; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, transform .06s, box-shadow .2s; }
.btn:active { transform: translateY(.5px) scale(.99); }
.btn.lg { height: 36px; padding: 0 16px; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.primary { background: var(--accent-solid); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.2); }
.btn.primary:hover { background: color-mix(in oklab, var(--accent-solid) 90%, white); }
.btn.glow { box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 1px var(--accent-line), 0 0 22px color-mix(in srgb, var(--accent) 50%, transparent); }
.btn.secondary { background: var(--raised); border-color: var(--line-2); box-shadow: var(--top-hl); }
.btn.secondary:hover { background: var(--s3); border-color: var(--line-3); }
.btn.ghost { background: transparent; color: var(--t2); }
.btn.ghost:hover { background: var(--hover); color: var(--t1); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--top-hl); }
.cap { font-size: 12px; color: var(--t3); font-weight: 500; }
.link { display: inline-flex; align-items: center; gap: 3px; border: 0; background: transparent; color: var(--accent-text); cursor: pointer; padding: 2px 0; font-weight: 500; font-size: 12.5px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; }
.seg button { height: 28px; padding: 0 12px; border: 0; background: transparent; border-radius: 6px; color: var(--t2); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--s3); color: var(--t1); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw { position: relative; width: 34px; height: 20px; border-radius: 99px; background: var(--s3); border: 1px solid var(--line-2); cursor: pointer; flex: none; padding: 0; transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--t2); transition: transform .18s cubic-bezier(.16,1,.3,1), background .15s; }
.sw[aria-checked="true"] { background: var(--accent-solid); border-color: transparent; }
.sw[aria-checked="true"]::after { transform: translateX(14px); background: #fff; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 500; border: 1px solid var(--line-2); color: var(--t2); }
.badge.acc { color: var(--accent-text); border-color: var(--accent-line); background: var(--accent-subtle); }
.badge.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent-solid) var(--p, 50%), var(--s3) var(--p, 50%)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 1px 4px rgba(0,0,0,.4); }
.bar { height: 3px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .5s cubic-bezier(.16,1,.3,1); }
.bar.warn > i { background: var(--warn); } .bar.danger > i { background: var(--danger); }

/* ── Hero stage (3D) ── */
.stage { position: relative; overflow: hidden; border-radius: 14px; background: #0A0A0D; border: 1px solid var(--line-2); }
.stage .gl, .stage .glfb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.glhost { position: absolute; inset: 0; }
.glfb { display: grid; place-items: center; color: var(--t3); text-align: center; }
.glfb svg { width: 52%; height: auto; color: var(--accent); opacity: .7; }
.stage .tag { position: absolute; left: 18px; top: 14px; font-size: 12px; color: var(--t3); font-weight: 500; pointer-events: none; }
.stage .hint { position: absolute; left: 18px; bottom: 12px; font-size: 11.5px; color: var(--t3); display: flex; align-items: center; gap: 8px; pointer-events: none; }
.stage .hint .kbd { background: transparent; }
.hero { height: 392px; }
.spec { position: absolute; top: 0; right: 0; bottom: 0; width: 244px; padding: 14px 18px 12px 28px; display: flex; flex-direction: column; background: linear-gradient(90deg, transparent, rgba(8,8,10,.82) 30%); }
.srow { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; flex: 1; transition: background .12s; }
.srow:hover, .srow.on { background: var(--press); }
.srow .k { font-size: 11.5px; color: var(--t3); font-weight: 500; }
.srow .v { font-size: 14px; font-weight: 600; letter-spacing: -.01em; margin: 1px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .s { font-size: 12px; color: var(--t2); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.detail .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-2); background: transparent; border-radius: 99px; padding: 3px 10px 3px 6px; color: var(--t2); cursor: pointer; font-size: 12px; }
.detail .back:hover { color: var(--t1); background: var(--hover); }
.detail h3 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
.detail p { margin: 0; color: var(--t2); font-size: 12px; }
.detail dl { margin: 4px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 12.5px; }
.detail dt { color: var(--t3); } .detail dd { margin: 0; text-align: right; }
.detail .btn { margin-top: auto; }
.co { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 3; }
.co.on { opacity: 1; }
.co .d { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }
.co .ln { position: absolute; height: 1px; background: color-mix(in srgb, var(--accent) 70%, white); transform-origin: 0 0; }
.co .lb { position: absolute; white-space: nowrap; padding: 6px 10px; border-radius: 8px; background: rgba(14,14,18,.9); border: 1px solid var(--accent-line); font-size: 12px; transform: translate(0,-50%); }
.co .lb b { font-weight: 600; margin-right: 8px; }
.co .lb .num { color: var(--accent-text); }

/* ── Home grid ── */
.hgrid { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.score { padding: 16px 16px 14px; position: relative; }
.score .top { display: flex; justify-content: space-between; align-items: center; }
.score .big { display: flex; align-items: baseline; gap: 6px; margin: 6px 0 8px; }
.score .big b { font: 600 40px/1 var(--mono); letter-spacing: -.04em; }
.score .big span { color: var(--t3); font-size: 15px; }
.arc { width: 100%; height: 6px; border-radius: 6px; background: var(--s3); overflow: hidden; }
.arc i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .8s cubic-bezier(.16,1,.3,1); }
.score p { margin: 10px 0 0; font-size: 12.5px; color: var(--t2); }
.score p b { color: var(--accent-text); font-weight: 600; }
.pop { position: absolute; z-index: 20; background: var(--card); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 12px 14px; animation: enter .16s cubic-bezier(.16,1,.3,1); }
.pop .r { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.pop .r:first-of-type { border-top: 0; }
.car { padding: 14px 16px; }
.car .top { display: flex; justify-content: space-between; align-items: center; }
.car .row { display: flex; gap: 16px; align-items: center; margin: 12px 0 10px; }
.cover { position: relative; width: 104px; height: 156px; border-radius: 8px; overflow: hidden; flex: none; box-shadow: 0 10px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08); animation: cov .35s cubic-bezier(.16,1,.3,1); color: #fff; }
@keyframes cov { from { opacity: 0; transform: translateX(14px) scale(.97); } }
.cover img { position: absolute; left: 50%; top: 40%; width: 56px; height: 56px; transform: translate(-50%,-50%); filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
.cover em { position: absolute; left: 8px; right: 8px; bottom: 9px; font: 600 12px/1.15 var(--font); font-style: normal; letter-spacing: -.01em; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.car h4 { margin: 0 0 4px; font-size: 15px; letter-spacing: -.02em; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots button { width: 6px; height: 6px; border-radius: 6px; border: 0; background: var(--line-3); padding: 0; cursor: pointer; transition: width .2s, background .2s; }
.dots button[aria-current="true"] { width: 18px; background: var(--accent); }
.car .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--t3); border-top: 1px solid var(--line); padding-top: 10px; }
.next { overflow: hidden; }
.next .hd { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 6px; }
.nrow { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); min-height: 56px; }
.nrow b { display: block; font-weight: 600; font-size: 13px; }
.nrow small { display: block; color: var(--t2); font-size: 12px; margin-top: 1px; }

/* ── GPU / inspector ── */
.ggrid { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 16px; align-items: start; }
.gpu-stage { height: 330px; }
.livecard { margin-top: 12px; padding: 14px 16px; }
.livecard .hd { display: flex; justify-content: space-between; align-items: baseline; }
.livecard h4 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
.livecard .lg { display: grid; grid-template-columns: 124px 1fr; gap: 20px; margin-top: 12px; align-items: center; }
.livecard .lg .cap { white-space: nowrap; }
.livecard .lg .big { font: 600 34px/1 var(--mono); letter-spacing: -.04em; }
.livecard .m { white-space: nowrap; display: grid; grid-template-columns: 52px 1fr 92px; gap: 4px 10px; align-items: center; font-size: 12px; }
.livecard .m span:first-child { color: var(--t3); } .livecard .m .num { text-align: right; color: var(--t1); }
.insp { overflow: hidden; }
.insp .hd { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.insp .hd h3 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
.insp .hd p { margin: 2px 0 0; color: var(--t2); font-size: 12.5px; }
.ig { padding: 10px 6px 4px; }
.ig .gl-t { font-size: 11.5px; color: var(--t3); font-weight: 500; padding: 4px 12px 2px; }
.irow { display: grid; grid-template-columns: 1fr auto 14px; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; min-height: 50px; }
.irow:hover { background: var(--hover); }
.irow b { display: block; font-weight: 500; }
.irow small { display: block; color: var(--t3); font-size: 12px; }
.irow .val { color: var(--t1); font-weight: 500; text-align: right; }
.irow .val.st-on { color: var(--accent-text); }
.irow .i { color: var(--t3); }
.sheet { position: absolute; top: 48px; right: 14px; bottom: 34px; width: 372px; z-index: 30; background: var(--card); border-radius: 14px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: sheet .22s cubic-bezier(.16,1,.3,1); }
@keyframes sheet { from { opacity: 0; transform: translateX(16px); } }
.sheet .sh { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet .sh h3 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
.sheet .sb2 { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.sheet .fld label { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 500; }
.sheet .fld small { color: var(--t3); display: block; margin-top: 4px; font-size: 12px; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.opt.on { border-color: var(--accent-line); background: var(--accent-subtle); }
.opt b { font-weight: 500; display: block; } .opt small { color: var(--t3); font-size: 12px; }
.curve { width: 100%; height: auto; background: var(--raised); border-radius: 10px; border: 1px solid var(--line); touch-action: none; user-select: none; }
.curve .g { stroke: var(--line-2); stroke-width: 1; }
.curve .l { fill: none; stroke: var(--accent); stroke-width: 2; }
.curve .a { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.curve circle { fill: var(--card); stroke: var(--accent); stroke-width: 2; cursor: grab; }
.curve text { fill: var(--t3); font: 10px var(--mono); }

/* ── Network ── */
.nstrip { display: flex; align-items: center; gap: 28px; padding: 14px 18px; margin-bottom: 12px; }
.nstrip .live .big { font: 600 34px/1 var(--mono); letter-spacing: -.04em; }
.nstrip .live .big small { font: 500 13px var(--font); color: var(--t3); letter-spacing: 0; margin-left: 4px; }
.nstrip .mets { display: flex; margin-left: auto; }
.nstrip .met { padding: 0 20px; border-left: 1px solid var(--line); }
.nstrip .met:first-child { border-left: 0; }
.nstrip .met b { display: block; font: 600 20px/1.2 var(--mono); letter-spacing: -.03em; }
.nstrip .met b small { font: 500 11px var(--font); color: var(--t3); margin-left: 3px; }
.net-stage { height: 330px; }
.nlab { position: absolute; transform: translate(-50%, 0); text-align: center; pointer-events: none; white-space: nowrap; }
.nlab .c { font-size: 11.5px; color: var(--t3); } .nlab b { display: block; font-size: 14px; font-weight: 600; margin: 1px 0; } .nlab .s { font-size: 12px; color: var(--t2); }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-top: 12px; }
.tile { text-align: left; padding: 14px; cursor: pointer; display: block; width: 100%; transition: border-color .12s, background .12s; }
.tile:hover { border-color: var(--line-3); background: var(--raised); }
.tile .t { font-weight: 500; color: var(--t2); }
.tile .big { font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin: 6px 0 2px; }
.tile small { color: var(--t3); font-size: 12px; display: block; }

/* ── Stage → Apply ── */
.stagebar { position: sticky; bottom: 12px; z-index: 12; margin: 0 32px 12px; max-width: 1096px; align-self: stretch; }
@media (min-width: 1230px) { .stagebar { margin-left: auto; margin-right: auto; width: calc(100% - 64px); } }
.sbar { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35), var(--top-hl); min-height: 52px; }
.sbar .tx { flex: 1; color: var(--t3); }
.sbar.has { border-color: var(--accent-line); }
.sbar.has .tx { color: var(--t1); font-weight: 500; }
.sbar .chips { display: flex; gap: 6px; }
.review { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: var(--card); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 6px; animation: enter .18s cubic-bezier(.16,1,.3,1); max-height: 300px; overflow: auto; }
.rv { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 9px 10px; border-radius: 8px; }
.rv:hover { background: var(--hover); }
.rv b { font-weight: 500; } .rv small { color: var(--t3); display: block; font-size: 12px; }
.rv .ba { font: 12px var(--mono); color: var(--t2); }
.rv .ba s { color: var(--t3); } .rv .ba i { color: var(--accent-text); font-style: normal; }
.toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 14px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow-pop); animation: enter .2s cubic-bezier(.16,1,.3,1); }
.toast .i { color: var(--ok); }

.stub { display: grid; place-items: center; text-align: center; padding: 64px 0; gap: 8px; color: var(--t2); }
.stub h3 { margin: 6px 0 0; color: var(--t1); font-size: 16px; }
.stub p { margin: 0 0 10px; max-width: 360px; }

@media (prefers-reduced-motion: reduce) { .app *, .app *::before, .app *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    <div class="mets">${met('download', 'dlV', 'Mbps')}${met('upload', 'ulV', 'Mbps')}${met('ping', 'pingV', 'ms')}${met('jitter', 'jitV', 'ms')}</div>
    <button class="btn primary lg" data-act="test" ${S.testing ? 'disabled' : ''}>${S.testing ? `<i class="spin"></i>${t('testing')}` : t('runTest')}</button></div>
    <div class="stage net-stage" id="stage"><div class="glhost" data-host="net">${fbHTML()}
      <div class="nlab" data-n="0"><div class="c">${t('thisPc')}</div><b>Intel® Ethernet I225-V</b><div class="s">Ethernet · 2.5 Gbps</div></div>
      <div class="nlab" data-n="1"><div class="c">${t('router')}</div><b>Humax router</b><div class="s">${t('wired')} · 1.2 ms</div></div>
      <div class="nlab" data-n="2"><div class="c">${t('internet')}</div><b><span data-b="pingV"></span> ms</b><div class="s">${t('region')} · ${t('regionPing').toLowerCase()}</div></div></div></div>
    <div class="tiles"><button class="card tile" data-act="sheet:tweaks"><div class="t">${t('tTweaks')}</div><div class="big">${nleft ? `${nleft} ${t('toApply')}` : '✓'}</div><small>${countOn(netKeys)} / 5 ${t('alreadyOn')}</small></button>
    <button class="card tile" data-act="toast:"><div class="t">${t('tAdapter')}</div><div class="big">12 ${t('toChange')}</div><small>${t('recFor')}</small></button>
    <button class="card tile" data-act="toast:"><div class="t">${t('regionPing')}</div><div class="big"><span data-b="pingV"></span> ms</div><small>${t('region')} · ${t('ago2d')}</small></button>
    <button class="card tile" data-act="toast:"><div class="t">${t('tHistory')}</div><div class="big">${S.res.fresh ? t('agoJust') : t('ago2d')}</div><small>${S.res.dl} ↓ ${S.res.ul} ↑</small></button>
    <button class="card tile" data-act="toast:"><div class="t">${t('tReset')}</div><div class="big">${t('defaults')}</div><small>${t('backToWin')}</small></button></div>`
}
async function runTest() {
  if (S.testing) return
  S.testing = true; S.test = { dl: 0, ul: 0, ping: 0, jit: 0 }; render()
  const t0 = performance.now(), ease = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3)
  await new Promise(res => {
    const step = () => {
      const s = (performance.now() - t0) / 1000
      S.test.ping = s < 1.4 ? 18 + Math.sin(s * 14) * 9 + 9 : 21; S.test.jit = s < 1.4 ? Math.abs(Math.sin(s * 9)) * 2.2 : .3
      S.test.dl = s < 1.4 ? 0 : 804 * ease((s - 1.4) / 2.4) * (s < 3.8 ? .94 + Math.sin(s * 10) * .06 : 1)
      S.test.ul = s < 3.8 ? 0 : 655 * ease((s - 3.8) / 2) * (s < 5.8 ? .94 + Math.sin(s * 10) * .06 : 1)
      invalidate(); if (s < 5.9) requestAnimationFrame(step); else res()
    }
    step()
  })
  S.res = { dl: 804, ul: 655, ping: 21, jit: .3, fresh: true }; S.test = null; S.testing = false; render()
}

/* ═══ Stage bar, review, toast ═══ */
const fmtK = (k, v) => (k === 'fanCurve' ? (eq(v, DEF.fanCurve) ? t('stock') : t('fan_custom')) : KEYS[k].fmt(v))
function stagebar() {
  const n = staged.size, areas = { gpu: 0, net: 0 }; staged.forEach((_, k) => areas[KEYS[k].area]++)
  const rev = S.review && n ? `<div class="review">${[...staged].map(([k, v]) => `<div class="rv"><div><b>${t(KEYS[k].name)}</b><small>${t('risk_' + KEYS[k].risk)}</small></div><div class="ba"><s>${fmtK(k, cur[k])}</s> → <i>${fmtK(k, v)}</i></div><button class="icon-btn" data-act="rmstage:${k}" aria-label="${t('remove')}">${ic('x', 14)}</button></div>`).join('')}</div>` : ''
  return `<div class="stagebar" id="stagebar">${rev}<div class="sbar ${n ? 'has' : ''}">${n
    ? `${ic('sliders')}<div class="tx">${n} ${n === 1 ? t('oneStaged') : t('changesStaged')}</div><div class="chips">${areas.gpu ? `<span class="badge acc">GPU · ${areas.gpu}</span>` : ''}${areas.net ? `<span class="badge acc">${t('network')} · ${areas.net}</span>` : ''}</div>
      <button class="btn ghost" data-act="review">${S.review ? t('hide') : t('review')}</button><button class="btn ghost" data-act="discard">${t('discard')}</button><button class="btn primary glow" data-act="apply" ${S.applying ? 'disabled' : ''}>${S.applying ? `<i class="spin"></i>${t('applying')}` : `${t('apply')} ${n}`}</button>`
    : `${ic('check')}<div class="tx">${t('nothing')} ${t('nothingSub')}</div><button class="btn secondary" disabled>${t('apply')}</button>`}</div></div>`
}
function renderStage() { const el = document.getElementById('stagebar'); if (el) el.outerHTML = stagebar(); refreshInspector(); invalidate() }
const toastHTML = () => (S.toast ? `<div class="toast" role="status">${ic('check')}<span>${S.toast.text}</span>${S.toast.undo ? `<button class="btn sm secondary" data-act="undo">${ic('undo', 14)}${t('undo')}</button>` : ''}</div>` : '')
let toastTimer = 0
function showToast(text, undo) { S.toast = { text, undo }; refreshToast(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; refreshToast() }, 6000) }
function refreshToast() { let el = document.getElementById('toast-slot'); if (!el) return; el.innerHTML = toastHTML() }
function refreshSpec() { const el = document.getElementById('spec'); if (el) { el.innerHTML = specHTML(); tickUI() } }
function refreshInspector() { const el = document.getElementById('insp'); if (el) { el.innerHTML = inspectorBody(); tickUI() } }
function refreshSheet() { const el = document.getElementById('sheet-body'); if (el) el.innerHTML = sheetBody(S.sheet) }
async function applyStaged() {
  if (!staged.size || S.applying) return
  S.applying = true; renderStage(); await sleep(900)
  const snap = { cur: JSON.parse(JSON.stringify(cur)), score: S.score }, n = staged.size
  for (const [k, v] of staged) { cur[k] = v; S.score += KEYS[k].gain }
  staged.clear(); S.applying = false; S.review = false
  showToast(`${t('applied')} · ${n}`, true); S.lastSnap = snap; render()
}

/* ═══ Render ═══ */
const $ = s => document.querySelector(s), app = $('#app')
let animateNext = true
function render() {
  const main = $('#main'), top = main ? main.scrollTop : 0, key = pageKey()
  app.className = 'app' + (S.theme === 'light' ? ' light' : ''); app.style.setProperty('--accent', S.accent); app.lang = S.lang; document.documentElement.lang = S.lang
  document.body.classList.toggle('pv-light', S.theme === 'light')
  const body = key === 'home' ? homePage() : key === 'gpu' ? gpuPage() : key === 'network' ? netPage() : `<div class="stub">${ic('inbox', 28)}<h3>${t('stubTitle')}</h3><p>${t('stubBody')}</p><button class="btn secondary" data-act="nav:home">${t('stubBtn')}</button></div>`
  app.innerHTML = titlebar() + sidebar() + `<main class="main" id="main">${pageHead()}<div class="page ${animateNext ? '' : 'noanim'}">${body}</div>${key === 'stub' ? '' : stagebar()}</main>` + statusbar() + sheetHTML() + `<div id="toast-slot">${toastHTML()}</div>`
  animateNext = false
  const m2 = $('#main'); if (m2) m2.scrollTop = top
  const host = $('[data-host]')
  if (host && use3D()) mount(host, host.dataset.host, key === 'gpu' ? 'gpu' : 'home'); else unmount()
  if (T && E.r) E.r.domElement.style.cursor = 'grab'
  tickUI(); renderBar()
}
function go(section, tab) {
  S.section = section; S.tab = tab ? tabId(tab) : tabId(TABS[section][0]); S.focus = null; S.sheet = null; S.review = false; S.scoreOpen = false; animateNext = true
  if (E.view?.id === 'rig') E.view.go('home', true)
  history.replaceState(null, '', pageKey() === 'stub' ? '#stub' : '#' + pageKey()); render()
}

/* ═══ Events ═══ */
const ACT = {
  nav: a => go(a), tab: a => go(S.section, a), go: a => (a === 'gpu' ? go('optimize', 'gpu') : go('optimize', 'network')),
  focus: a => (E.view?.id === 'rig' && pageKey() === 'home' ? setFocus(a) : (S.focus = a, refreshSpec())), back: () => setFocus(null),
  toast: () => showToast(t('notHere')), score: () => { S.scoreOpen = !S.scoreOpen; render() },
  game: a => { S.game = +a; render() }, gprev: () => { S.game = (S.game + GAMES.length - 1) % GAMES.length; render() }, gnext: () => { S.game = (S.game + 1) % GAMES.length; render() },
  sheet: a => { if (SHEET_TITLE[a]) { S.sheet = a; render() } else showToast(t('notHere')) }, closesheet: () => { S.sheet = null; render() },
  preset: a => { stageSet('preset', a); refreshSheet(); renderStage() }, tog: a => { stageSet(a, !val(a)); refreshSheet(); renderStage() },
  fanmode: a => { stageSet('fanMode', a); if (a === 'auto') staged.delete('fanCurve'); refreshSheet(); renderStage() },
  review: () => { S.review = !S.review; renderStage() }, discard: () => { staged.clear(); S.review = false; refreshSheet(); renderStage() }, rmstage: a => { staged.delete(a); if (!staged.size) S.review = false; refreshSheet(); renderStage() },
  apply: () => applyStaged(), test: () => runTest(),
  undo: () => { if (S.lastSnap) { Object.assign(cur, S.lastSnap.cur); S.score = S.lastSnap.score; S.lastSnap = null; S.toast = null; render() } },
}
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return
  const [name, ...rest] = el.dataset.act.split(':'); ACT[name]?.(rest.join(':'))
})
app.addEventListener('input', e => {
  const k = e.target.dataset?.in; if (!k) return
  const v = +e.target.value, min = +e.target.min, max = +e.target.max
  e.target.style.setProperty('--p', (v - min) / (max - min) * 100 + '%'); stageSet(k, v)
  const l = document.getElementById('lbl-' + k); if (l) l.textContent = KEYS[k].fmt(v); renderStage()
})
app.addEventListener('mouseover', e => { const r = e.target.closest('.srow'); if (r && r.dataset.part) setHover(r.dataset.part) })
app.addEventListener('mouseout', e => { if (e.target.closest('.srow') && !e.relatedTarget?.closest?.('.srow')) setHover(null) })
app.addEventListener('wheel', e => { if (e.target.closest('#car') && Math.abs(e.deltaY) > 4) { e.preventDefault(); ACT[e.deltaY > 0 ? 'gnext' : 'gprev']() } }, { passive: false })
let drag = -1
app.addEventListener('pointerdown', e => { const p = e.target.closest('[data-pt]'); if (p) { drag = +p.dataset.pt; e.preventDefault() } })
addEventListener('pointermove', e => {
  if (drag < 0) return
  const svg = document.getElementById('curve'); if (!svg) return
  const rc = svg.getBoundingClientRect(), sx = (e.clientX - rc.left) / rc.width * 300, sy = (e.clientY - rc.top) / rc.height * 170
  const c = JSON.parse(JSON.stringify(val('fanCurve'))), lo = drag ? c[drag - 1][0] + 2 : 20, hi = drag < c.length - 1 ? c[drag + 1][0] - 2 : 90
  c[drag] = [Math.round(clamp(20 + (sx - 28) / 260 * 70, lo, hi)), Math.round(clamp((150 - sy) / 140 * 100, 0, 100))]
  stageSet('fanMode', 'custom'); stageSet('fanCurve', c); refreshSheet(); renderStage()
})
addEventListener('pointerup', () => { drag = -1 })
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (S.sheet) ACT.closesheet(); else if (S.scoreOpen) ACT.score(); else if (S.focus) setFocus(null)
})

/* ═══ Preview chrome ═══ */
const bar = $('#pvbar')
function renderBar() {
  const g = (label, items) => `<div class="pv-group"><span>${label}</span>${items}</div>`
  const b = (a, txt, on) => `<button class="pv-btn" data-pv="${a}" aria-pressed="${!!on}">${txt}</button>`
  const pk = pageKey()
  bar.innerHTML = g(t('theme'), b('theme:dark', 'Dark', S.theme === 'dark') + b('theme:light', 'Light', S.theme === 'light')) +
    g(t('accent'), Object.entries(ACCENTS).map(([k, v]) => `<button class="pv-sw" style="background:${v}" title="${k}" aria-label="${k}" aria-pressed="${S.accent === v}" data-pv="accent:${v}"></button>`).join('')) +
    g(t('lang'), b('lang:en', 'EN', S.lang === 'en') + b('lang:fi', 'FI', S.lang === 'fi')) +
    g(t('page'), b('page:home', t('home'), pk === 'home') + b('page:gpu', 'GPU', pk === 'gpu') + b('page:network', t('network'), pk === 'network')) +
    `<div class="pv-group"><span>${t('simLoad')}</span><input type="range" min="0" max="100" value="${S.load}" id="pvload" aria-label="${t('simLoad')}"><b id="pvloadv">${S.load}</b></div>` +
    g(t('rCooler'), b('cooler:aio', 'AIO', S.rig.cooler === 'aio') + b('cooler:air', 'Air', S.rig.cooler === 'air')) +
    g(t('rRam'), b('ram:2', '2', S.rig.ram === 2) + b('ram:4', '4', S.rig.ram === 4)) +
    g(t('rDrives'), [1, 2, 3].map(n => b('drives:' + n, n, S.rig.drives === n)).join('')) +
    g(t('rGpuFans'), b('gpuFans:2', '2', S.rig.gpuFans === 2) + b('gpuFans:3', '3', S.rig.gpuFans === 3)) +
    g(t('quality'), b('quality:full', t('qFull'), S.quality === 'full') + b('quality:reduced', t('qReduced'), S.quality === 'reduced') + b('quality:off', t('qOff'), S.quality === 'off'))
}
function dropViews() { Object.values(E.views).forEach(v => { v.controls.dispose(); v.rig?.dispose() }); E.views = {}; E.view = null }
bar.addEventListener('click', e => {
  const el = e.target.closest('[data-pv]'); if (!el) return
  const [k, ...r] = el.dataset.pv.split(':'), a = r.join(':')
  if (k === 'theme') S.theme = a
  else if (k === 'accent') { S.accent = a; dropViews() }
  else if (k === 'lang') S.lang = a
  else if (k === 'page') { if (a === 'home') go('home'); else go('optimize', a); return }
  else if (k === 'quality') { S.quality = a; applyQuality() }
  else { S.rig[k] = k === 'cooler' ? a : +a; S.focus = null }
  render()
})
bar.addEventListener('input', e => { if (e.target.id !== 'pvload') return; S.load = +e.target.value; $('#pvloadv').textContent = S.load; invalidate() })
function fit() {
  const sc = $('#scaler'), W = 1280, H = 820, s = Math.min(innerWidth / W, (innerHeight - 48) / H, 1.25)
  sc.style.width = W * s + 'px'; sc.style.height = H * s + 'px'; app.style.width = W + 'px'; app.style.height = H + 'px'; app.style.transform = `scale(${s})`
}
addEventListener('resize', fit); fit()

/* ═══ Boot ═══ */
{
  const h = location.hash.slice(1)
  if (h === 'gpu') { S.section = 'optimize'; S.tab = 'gpu' } else if (h === 'network') { S.section = 'optimize'; S.tab = 'network' } else if (h === 'stub') { S.section = 'gaming'; S.tab = 'pulse' }
  const q = new URLSearchParams(location.search); if (q.get('lang') === 'fi') S.lang = 'fi'; if (q.get('theme') === 'light') S.theme = 'light'; if (q.get('quality')) S.quality = q.get('quality')
  simStep(1, performance.now()); render(); setInterval(tickUI, 400)
}
</script>
