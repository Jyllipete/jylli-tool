<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="assets/fa/css/all.min.css">
<link rel="stylesheet" href="css/pulse.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
<title>Pulse</title>
</head>
<body class="pu-win">
<header id="pu-titlebar" class="pu-tb">
  <div class="pu-tb-title"><i class="fa fa-bolt" aria-hidden="true"></i><span>Pulse</span><span class="pu-tb-state" id="ck-state"><span class="pu-dot" id="ck-dot" data-tone="idle"></span><span id="ck-state-t"></span></span></div>
  <div class="pu-tb-btns">
    <button type="button" class="pu-tb-btn" id="ck-hud" aria-pressed="false"><i class="fa fa-display" aria-hidden="true"></i></button>
    <button type="button" class="pu-tb-btn" id="ck-pin" aria-pressed="false"><i class="fa fa-thumbtack" aria-hidden="true"></i></button>
    <button type="button" class="pu-tb-btn" id="ck-min"><i class="fa fa-minus" aria-hidden="true"></i></button>
    <button type="button" class="pu-tb-btn pu-tb-close" id="ck-close"><i class="fa fa-xmark" aria-hidden="true"></i></button>
  </div>
</header>
<div class="pu-keep" id="ck-keep" hidden role="alertdialog" aria-live="assertive">
  <span id="ck-keep-t"></span>
  <button type="button" class="pu-sec" id="ck-keep-yes"></button>
  <button type="button" class="pu-cta" id="ck-keep-no"></button>
  <button type="button" class="pu-ghost" id="ck-keep-cancel"></button>
</div>
<main class="jk pu pu-ck" id="ck-root"></main>

<script src="js/lang/pulse-en.js"></script>
<script src="js/lang/pulse-fi.js"></script>
<script src="js/theme-sync.js"></script>
<script src="js/score.js"></script>
<script src="lib/pulse/attribution.js"></script>
<script src="lib/pulse/frames.js"></script>
<script src="lib/pulse/river.js"></script>
<script src="lib/pulse/score.js"></script>
<script src="lib/pulse/steps.js"></script>
<script src="js/pulse/ui.js"></script>
<script src="js/pulse/river-view.js"></script>
<script src="js/pulse/cockpit.js"></script>
</body>
</html>
