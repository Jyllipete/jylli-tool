<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="assets/fa/css/all.min.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Pulse</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-void:       var(--c-bg-base);
  --bg-surface:    var(--c-bg-elevated);
  --bg-raised:     var(--c-bg-raised);
  --bg-overlay:    var(--c-bg-elevated);
  --border-dim:    var(--c-border-subtle);
  --border-active: var(--c-border-default);
  --border-glow:   var(--c-accent-ring);
  --accent:        var(--c-accent);
  --accent-dim:    var(--c-accent-muted);
  --accent-glow:   var(--c-accent-glow);
  /* Hardware-specific colors — keep unchanged */
  --cpu-color:     #FF4C7A;
  --gpu-color:     #00D4B4;
  --ram-color:     #7C6AFF;
  --danger:        #FF3A3A;
  --warning:       #FFB547;
  --info:          #3A9EFF;
  --ok:            #2ECC71;
  --text-primary:  var(--c-text-primary);
  --text-dim:      var(--c-text-secondary);
  --text-muted:    var(--c-text-tertiary);
  --font-display:  'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-mono:     'Geist Mono', 'Cascadia Code', 'Consolas', monospace;
  --font-body:     'Geist', 'Segoe UI', system-ui, sans-serif;
  /* Pulse-specific animation tokens — keep unchanged */
  --ease-snap:     cubic-bezier(0.19,1,0.22,1);
  --ease-smooth:   cubic-bezier(0.4,0,0.2,1);
  --dur-fast:      120ms;
  --dur-normal:    240ms;
  --dur-slow:      400ms;
}
html, body {
  background-color: var(--bg-void);
  background-image:
    radial-gradient(ellipse 120% 80% at 20% 0%, rgba(0,212,180,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 80% 60% at 80% 100%, rgba(124,106,255,0.04) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  height: 100%;
  overflow: hidden;
  user-select: none;
  -webkit-app-region: no-drag;
}

/* ── Titlebar ── */
#titlebar {
  display: flex;
  align-items: center;
  height: 40px;
  background: var(--bg-void);
  border-bottom: 1px solid var(--border-dim);
  padding: 0 14px;
  -webkit-app-region: drag;
  flex-shrink: 0;
}
#titlebar .title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.08em;
  flex: 1;
}
#titlebar .title i { color: var(--accent); font-size: 14px; }
#titlebar .badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  background: var(--bg-raised);
  border: 1px solid var(--border-dim);
  color: var(--text-dim);
  margin-right: 10px;
}
#titlebar .badge.live {
  background: var(--accent-dim);
  border-color: var(--border-glow);
  color: var(--accent);
}
.tb-btn {
  -webkit-app-region: no-drag;
  width: 26px; height: 26px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  margin-left: 4px;
  transition: all var(--dur-fast);
}
.tb-btn:hover { background: var(--border-active); color: var(--text-primary); }
.tb-btn.close:hover { background: var(--danger); color: #fff; }

/* ── Layout ── */
#app {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 40px);
  overflow-y: auto;
  padding: 14px 16px;
  gap: 12px;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

/* ── Cards ── */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-dim);
  border-radius: 12px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  transition: border-color var(--dur-normal) var(--ease-smooth),
              box-shadow var(--dur-normal) var(--ease-smooth);
  animation: cardIn var(--dur-slow) var(--ease-snap) both;
  animation-delay: calc(var(--i, 0) * 80ms);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
  opacity: 0;
  transition: opacity var(--dur-normal);
}
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(180px circle at var(--mx,50%) var(--my,50%), var(--accent-glow), transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur-normal);
}
.card:hover { border-color: var(--border-active); box-shadow: 0 0 0 1px var(--border-glow), 0 8px 32px rgba(0,0,0,0.4); }
.card:hover::before, .card:hover::after { opacity: 1; }
@keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

.card-label {
  font-family: var(--font-display);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-dim);
  display: block;
}

/* ── Preset grid ── */
.preset-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.preset-card {
  background: var(--bg-raised);
  border: 1px solid var(--border-dim);
  border-radius: 10px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-smooth);
  text-align: center;
}
.preset-card:hover { border-color: var(--border-glow); background: var(--accent-glow); transform: translateY(-1px); }
.preset-card:hover i, .preset-card:hover .pname { color: var(--accent); }
.preset-card.selected {
  border-color: var(--accent);
  background: var(--accent-dim);
  box-shadow: 0 0 16px rgba(0,212,180,0.15);
}
.preset-card.selected i, .preset-card.selected .pname { color: var(--accent); }
.preset-card i { font-size: 1rem; color: var(--text-dim); }
.preset-card .pname { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); }

/* ── Options ── */
.opt-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-dim);
  cursor: pointer;
}
.opt-row:last-child { border-bottom: none; }
.opt-row input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; }
.opt-title { font-size: 0.8rem; font-weight: 500; color: var(--text-primary); }
.opt-sub { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }

/* ── Live monitor ── */
.monitor-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0;
}
.monitor-toggle {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  padding: 2px 4px; font-size: 0.75rem; border-radius: 4px;
  transition: color var(--dur-fast);
  -webkit-app-region: no-drag;
}
.monitor-toggle:hover { color: var(--accent); }
.monitor-body {
  overflow: hidden;
  transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.2s ease;
  max-height: 0;
  opacity: 0;
  margin-top: 0;
}
.monitor-body.open {
  max-height: 300px;
  opacity: 1;
  margin-top: 10px;
}
.metric-row { margin-bottom: 7px; }
.metric-row:last-child { margin-bottom: 0; }
.metric-head { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: baseline; }
.metric-label { font-family: var(--font-display); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
.metric-val { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-primary); font-weight: 500; }
.metric-sub { font-size: 0.6rem; color: var(--text-dim); margin-left: 6px; }
.metric-track {
  height: 3px;
  background: var(--border-dim);
  border-radius: 2px;
  overflow: hidden;
}
.metric-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 400ms var(--ease-snap);
  width: 0%;
}
.metric-net {
  display: flex; justify-content: space-between;
  font-size: 0.65rem; color: var(--text-dim); margin-top: 2px;
  font-family: var(--font-mono);
}
#monitor-spark {
  display: block; width: 100%; height: 40px;
  margin-top: 10px; border-radius: 6px;
  background: var(--bg-raised);
  border: 1px solid var(--border-dim);
  opacity: 0.85;
}

/* ── Buttons ── */
.btn {
  border: none; border-radius: 8px;
  font-family: var(--font-display); font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; padding: 9px 18px;
  display: inline-flex; align-items: center; gap: 7px;
  transition: all var(--dur-fast) var(--ease-smooth);
}
.btn-pink { background: var(--accent); color: #000; transition: filter 0.13s ease, box-shadow 0.13s ease; }
.btn-pink:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 0 0 1px rgba(0,212,180,0.5), 0 0 18px rgba(0,212,180,0.28); }
.btn-pink:active:not(:disabled) { transform: scale(0.97); filter: brightness(0.95); }
.btn-pink:disabled { background: var(--accent-dim); color: var(--text-dim); cursor: not-allowed; transform: none; filter: none; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-active);
  color: var(--text-dim);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-stop { background: rgba(255,58,58,0.08); border: 1px solid rgba(255,58,58,0.25); color: var(--danger); }
.btn-stop:hover:not(:disabled) { background: rgba(255,58,58,0.18); box-shadow: 0 0 12px rgba(255,58,58,0.2); }
.btn-stop:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Detect result ── */
#detect-result { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); min-height: 14px; margin-top: 8px; }

/* ── Process table ── */
.proc-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
.proc-table th {
  text-align: left; padding: 8px 10px;
  color: var(--accent); font-family: var(--font-display); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  border-bottom: 1px solid var(--border-dim);
  cursor: pointer; white-space: nowrap;
  position: sticky; top: 0;
  background: var(--bg-surface);
  backdrop-filter: blur(8px);
}
.proc-table th:hover { color: var(--text-primary); }
.proc-table td { padding: 5px 10px; border-bottom: 1px solid var(--border-dim); color: var(--text-primary); font-size: 0.7rem; }
.proc-table tr:nth-child(odd) td { background: rgba(255,255,255,0.015); }
.proc-table tr:hover td { background: var(--accent-glow); }
.proc-table tr { animation: rowSlideIn 60ms var(--ease-smooth) both; }
@keyframes rowSlideIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }
.bar-wrap { height: 4px; background: var(--border-dim); border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 400ms var(--ease-snap); }
.kill-btn {
  background: transparent; border: none;
  color: var(--text-dim); border-radius: 4px;
  width: 22px; height: 22px;
  cursor: pointer; font-size: 0.7rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--dur-fast);
}
.kill-btn:hover { color: var(--danger); box-shadow: 0 0 8px var(--danger); transform: scale(1.15); }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 20px; right: 20px;
  min-width: 260px;
  padding: 12px 18px;
  background: var(--bg-overlay);
  border: 1px solid var(--border-active);
  border-radius: 10px;
  backdrop-filter: blur(12px);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.03em;
  color: var(--text-primary);
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  display: none;
  z-index: 9999;
  animation: toastIn 0.25s var(--ease-snap) forwards;
}
@keyframes toastIn { from { transform:translateX(32px); opacity:0; } to { transform:none; opacity:1; } }

/* ── Pulse breathing border ── */
#app.is-pulsing .card:first-child {
  animation: borderBreathe 2s ease-in-out infinite;
}
@keyframes borderBreathe {
  0%, 100% { box-shadow: 0 0 0 1px rgba(0,212,180,0.15), 0 0 20px rgba(0,212,180,0.04); }
  50%       { box-shadow: 0 0 0 1px rgba(0,212,180,0.55), 0 0 32px rgba(0,212,180,0.12); }
}
</style>
</head>
<body>

<!-- Titlebar -->
<div id="titlebar">
  <div class="title">
    <i class="fa fa-satellite-dish"></i>
    Pulse
  </div>
  <div id="status-badge" class="badge">● IDLE</div>
  <button class="tb-btn" id="btn-minimize" onclick="api.minimize()" title="Minimize"><i class="fa fa-minus"></i></button>
  <button class="tb-btn close" id="btn-close" onclick="closePulseWindow()" title="Close"><i class="fa fa-xmark"></i></button>
</div>

<!-- Main content -->
<div id="app">

  <!-- Game Presets -->
  <div class="card" style="--i:0">
    <div class="card-label" id="lbl-game-presets">GAME PRESETS</div>
    <div class="preset-grid" id="preset-grid"></div>
  </div>

  <!-- Options + Live Monitor side by side -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

    <!-- Options -->
    <div class="card" style="--i:1">
      <div class="card-label" id="lbl-options">OPTIONS</div>
      <label class="opt-row">
        <input type="checkbox" id="opt-kill" checked>
        <div><div class="opt-title" id="lbl-opt-kill">Kill background apps</div><div class="opt-sub" id="lbl-opt-kill-sub">Discord, browsers, Spotify, OneDrive…</div></div>
      </label>
      <label class="opt-row">
        <input type="checkbox" id="opt-affinity" checked>
        <div><div class="opt-title" id="lbl-opt-affinity">CPU affinity optimisation</div><div class="opt-sub" id="lbl-opt-affinity-sub">Pins game to performance cores</div></div>
      </label>
      <label class="opt-row">
        <input type="checkbox" id="opt-mmcss" checked>
        <div><div class="opt-title" id="lbl-opt-mmcss">MMCSS GPU priority boost</div><div class="opt-sub" id="lbl-opt-mmcss-sub">Raises GPU scheduling priority to High</div></div>
      </label>
    </div>

    <!-- Live Monitor -->
    <div class="card" style="--i:2">
      <div class="monitor-header">
        <div class="card-label" id="lbl-live-monitor" style="margin-bottom:0">LIVE MONITOR</div>
        <button class="monitor-toggle" id="monitor-toggle-btn" onclick="toggleMonitor()" title="Toggle live monitor">
          <i class="fa fa-chevron-down" id="monitor-chevron"></i>
        </button>
      </div>
      <div class="monitor-body" id="monitor-body">
        <div class="metric-row">
          <div class="metric-head">
            <span class="metric-label">CPU</span>
            <span><span class="metric-val" id="cpu-val">—</span><span class="metric-sub" id="cpu-temp-val"></span></span>
          </div>
          <div class="metric-track"><div class="metric-fill" id="cpu-bar" style="background:var(--cpu-color)"></div></div>
        </div>
        <div class="metric-row">
          <div class="metric-head">
            <span class="metric-label">RAM</span>
            <span><span class="metric-val" id="ram-val">—</span><span class="metric-sub" id="ram-detail"></span></span>
          </div>
          <div class="metric-track"><div class="metric-fill" id="ram-bar" style="background:var(--ram-color)"></div></div>
        </div>
        <div class="metric-row">
          <div class="metric-head">
            <span class="metric-label">GPU</span>
            <span><span class="metric-val" id="gpu-val">—</span><span class="metric-sub" id="gpu-temp-val"></span></span>
          </div>
          <div class="metric-track"><div class="metric-fill" id="gpu-bar" style="background:var(--gpu-color)"></div></div>
        </div>
        <div class="metric-row" style="margin-bottom:0">
          <div class="metric-net">
            <span><span style="color:var(--text-dim)">NET</span></span>
            <span id="net-val" style="color:var(--text-dim)">↓ — &nbsp; ↑ —</span>
          </div>
        </div>
        <canvas id="monitor-spark"></canvas>
      </div>
      <div id="detect-result" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Action buttons -->
  <div style="display:flex;gap:8px">
    <button class="btn btn-pink" id="start-btn" onclick="doPulseStart()" style="flex:1;justify-content:center;font-size:13px" disabled>
      <i class="fa fa-satellite-dish"></i> <span id="lbl-activate-pulse">Activate Pulse</span>
    </button>
    <button class="btn btn-stop" id="stop-btn" onclick="doPulseStop()" disabled>
      <i class="fa fa-stop"></i> <span id="lbl-stop">Stop</span>
    </button>
    <button class="btn btn-ghost" onclick="doPulseDetect()" title="Auto-detect running game" style="padding:10px 14px">
      <i class="fa fa-magnifying-glass"></i>
    </button>
  </div>

  <!-- Process table -->
  <div class="card" style="--i:3;padding:0;overflow:hidden;flex:1">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-dim)">
      <span id="lbl-running-processes" style="font-family:var(--font-display);font-size:0.55rem;font-weight:700;color:var(--accent);letter-spacing:0.14em;text-transform:uppercase;flex:1">RUNNING PROCESSES</span>
      <input id="proc-filter" type="text" placeholder="Filter…" oninput="filterProcs(this.value)"
        style="background:var(--bg-raised);border:none;border-bottom:2px solid transparent;border-radius:5px;padding:3px 9px;color:var(--text-primary);font-size:0.7rem;font-family:var(--font-mono);outline:none;width:120px;transition:border-color var(--dur-fast)" onfocus="this.style.borderBottomColor='var(--accent)'" onblur="this.style.borderBottomColor='transparent'">
      <button class="btn btn-ghost" onclick="loadProcs(this)" style="padding:4px 10px;font-size:0.65rem;gap:5px">
        <i class="fa fa-arrows-rotate"></i> <span id="lbl-refresh">Refresh</span>
      </button>
      <span id="proc-count" style="font-size:0.6rem;color:var(--text-dim)"></span>
    </div>
    <div style="max-height:280px;overflow-y:auto">
      <table class="proc-table" id="proc-table">
        <thead><tr>
          <th onclick="sortProcs('name')" id="lbl-col-process">Process</th>
          <th onclick="sortProcs('cpu')" style="width:72px" id="lbl-col-cpu">CPU %</th>
          <th onclick="sortProcs('ram')" style="width:84px" id="lbl-col-ram">RAM (MB)</th>
          <th style="width:46px" id="lbl-col-pid">PID</th>
          <th style="width:38px"></th>
        </tr></thead>
        <tbody id="proc-tbody">
          <tr><td colspan="5" style="text-align:center;color:#333;padding:20px" id="lbl-loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ── i18n ──
const LANG_PULSE = {
  en: {
    gamePresets: 'GAME PRESETS',
    options: 'OPTIONS',
    liveMonitor: 'LIVE MONITOR',
    optKill: 'Kill background apps',
    optKillSub: 'Discord, browsers, Spotify, OneDrive…',
    optAffinity: 'CPU affinity optimisation',
    optAffinitySub: 'Pins game to performance cores',
    optMmcss: 'MMCSS GPU priority boost',
    optMmcssSub: 'Raises GPU scheduling priority to High',
    activatePulse: 'Activate Pulse',
    activating: 'Activating…',
    pulseActive: 'Pulse Active',
    stop: 'Stop',
    runningProcesses: 'RUNNING PROCESSES',
    filter: 'Filter…',
    refresh: 'Refresh',
    colProcess: 'Process',
    colCpu: 'CPU %',
    colRam: 'RAM (MB)',
    colPid: 'PID',
    loading: 'Loading…',
    scanning: 'Scanning…',
    detected: 'Detected:',
    pulseLive: '● LIVE',
    pulseIdle: '● IDLE',
    pulseStartFail: 'Failed to start Pulse',
    pulseStopped: 'Pulse stopped',
    stopConfirm: 'Pulse is still active. Stop it and close?',
    killConfirm: 'Kill {name} (PID {pid})?',
    killed: 'Killed',
    failed: 'Failed',
    winMinimize: 'Minimize',
    winClose: 'Close',
    ttLiveMonitor: 'Toggle live monitor',
    ttAutoDetect: 'Auto-detect running game',
  },
  fi: {
    gamePresets: 'PELIESIASETUKSET',
    options: 'ASETUKSET',
    liveMonitor: 'REAALIAIKAINEN SEURANTA',
    optKill: 'Sulje taustasovellukset',

    optAffinitySub: 'Kiinnittää pelin suorituskykyytimille',
    optMmcss: 'MMCSS GPU -prioriteettitehostus',
    optMmcssSub: 'Nostaa GPU-ajastuksen prioriteetin korkeaksi',
    activatePulse: 'Käynnistä Pulse',
    activating: 'Käynnistetään…',
    pulseActive: 'Pulse aktiivinen',

    runningProcesses: 'KÄYNNISSÄ OLEVAT PROSESSIT',
    filter: 'Suodata…',

    colCpu: 'CPU %',
    colRam: 'RAM (Mt)',
    colPid: 'PID',

    scanning: 'Skannataan…',
    detected: 'Havaittu:',

    pulseIdle: '● IDLE',

    stopConfirm: 'Pulse on vielä aktiivinen. Pysäytetäänkö ja suljetaanko?',

  }
}
function getLang() {
  try { return JSON.parse(localStorage.getItem('jylli-settings') || '{}').language || 'en' } catch { return 'en' }
}
function tP(key) { const l = getLang(); return (LANG_PULSE[l] || LANG_PULSE.en)[key] || LANG_PULSE.en[key] || key }

// ── State ──
const PRESET_ICONS = {
  fortnite:'fa-crosshairs', valorant:'fa-crosshairs', csgo:'fa-crosshairs',
  fivem:'fa-car', warzone:'fa-crosshairs', apex:'fa-crosshairs',
  minecraft:'fa-cube', arma:'fa-shield-halved', tarkov:'fa-person-rifle',
  rocketleague:'fa-futbol'
}

let selectedPreset = null
let pulseActive = false
let procData = [], procSort = { key: 'ram', dir: -1 }
let metricsInterval = null
let monitorOpen = false
const SPARK_LEN = 40
const _sparkCpu = [], _sparkGpu = []

// ── i18n apply ──
function applyTranslations() {
  const t = (id, key) => { const el = document.getElementById(id); if (el) el.textContent = tP(key) }
  t('lbl-game-presets', 'gamePresets')
  t('lbl-options', 'options')
  t('lbl-live-monitor', 'liveMonitor')
  t('lbl-opt-kill', 'optKill')
  t('lbl-opt-kill-sub', 'optKillSub')
  t('lbl-opt-affinity', 'optAffinity')
  t('lbl-opt-affinity-sub', 'optAffinitySub')
  t('lbl-opt-mmcss', 'optMmcss')
  t('lbl-opt-mmcss-sub', 'optMmcssSub')
  t('lbl-activate-pulse', 'activatePulse')
  t('lbl-stop', 'stop')
  t('lbl-running-processes', 'runningProcesses')
  t('lbl-refresh', 'refresh')
  t('lbl-col-process', 'colProcess')
  t('lbl-col-cpu', 'colCpu')
  t('lbl-col-ram', 'colRam')
  t('lbl-col-pid', 'colPid')
  t('lbl-loading', 'loading')
  const fi = document.getElementById('proc-filter')
  if (fi) fi.placeholder = tP('filter')
  const tt = (id, key) => { const el = document.getElementById(id); if (el) el.title = tP(key) }
  tt('btn-minimize', 'winMinimize')
  tt('btn-close', 'winClose')
  tt('monitor-toggle-btn', 'ttLiveMonitor')
  const detectBtn = document.querySelector('[onclick="doPulseDetect()"]')
  if (detectBtn) detectBtn.title = tP('ttAutoDetect')
}

// ── Init ──
async function init() {
  applyTranslations()
  const presets = await api.pulseGetPresets()
  const grid = document.getElementById('preset-grid')
  grid.innerHTML = presets.map(p => `
    <div class="preset-card" id="pc-${p.id}" onclick="selectPreset('${p.id}')">
      <i class="fa ${PRESET_ICONS[p.id] || 'fa-gamepad'}"></i>
      <div class="pname">${p.name}</div>
    </div>
  `).join('')

  loadProcs()
  initMonitor()
  doPulseDetect()

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect()
      card.style.setProperty('--mx', `${e.clientX - r.left}px`)
      card.style.setProperty('--my', `${e.clientY - r.top}px`)
    })
  })
}

// ── Preset selection ──
function selectPreset(id) {
  document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('selected'))
  document.getElementById(`pc-${id}`)?.classList.add('selected')
  selectedPreset = id
  if (!pulseActive) document.getElementById('start-btn').disabled = false
}

// ── Pulse actions ──
async function doPulseStart() {
  if (!selectedPreset) return
  const startBtn = document.getElementById('start-btn')
  const stopBtn = document.getElementById('stop-btn')
  startBtn.disabled = true
  startBtn.innerHTML = `<i class="fa fa-spinner fa-spin"></i> ${tP('activating')}`
  const r = await api.pulseStart({
    presetId: selectedPreset,
    killBg: document.getElementById('opt-kill')?.checked,
    cpuCores: document.getElementById('opt-affinity')?.checked ? 'performance' : 'all',
    mmcss: document.getElementById('opt-mmcss')?.checked
  })
  if (r.ok) {
    pulseActive = true
    startBtn.innerHTML = `<i class="fa fa-check"></i> ${tP('pulseActive')}`
    stopBtn.disabled = false
    setBadge(true)
    document.getElementById('app').classList.add('is-pulsing')
    showToast(tP('pulseActive'), 'ok')
  } else {
    startBtn.disabled = false
    startBtn.innerHTML = `<i class="fa fa-satellite-dish"></i> ${tP('activatePulse')}`
    showToast(tP('pulseStartFail'), 'err')
  }
}

async function doPulseStop() {
  await api.pulseStop()
  pulseActive = false
  const startBtn = document.getElementById('start-btn')
  const stopBtn = document.getElementById('stop-btn')
  if (startBtn) { startBtn.disabled = false; startBtn.innerHTML = `<i class="fa fa-satellite-dish"></i> ${tP('activatePulse')}` }
  if (stopBtn) stopBtn.disabled = true
  setBadge(false)
  document.getElementById('app').classList.remove('is-pulsing')
  showToast(tP('pulseStopped'), 'info')
}

async function doPulseDetect() {
  const el = document.getElementById('detect-result')
  if (el) el.textContent = tP('scanning')
  const r = await api.pulseDetectGame()
  if (r.found) {
    if (el) el.innerHTML = `<span style="color:var(--success)"><i class="fa fa-check"></i> ${tP('detected')} ${r.name}</span>`
    selectPreset(r.id)
  } else {
    if (el) el.textContent = ''
  }
}

function setBadge(live) {
  const b = document.getElementById('status-badge')
  if (!b) return
  if (live) {
    b.textContent = tP('pulseLive')
    b.classList.add('live')
  } else {
    b.textContent = tP('pulseIdle')
    b.classList.remove('live')
  }
}

// ── Monitor toggle ──
function toggleMonitor() {
  monitorOpen = !monitorOpen
  localStorage.setItem('pulse_monitor_expanded', monitorOpen ? '1' : '0')
  const body = document.getElementById('monitor-body')
  const chevron = document.getElementById('monitor-chevron')
  if (monitorOpen) {
    body.classList.add('open')
    chevron.classList.replace('fa-chevron-down', 'fa-chevron-up')
    startMetrics()
  } else {
    body.classList.remove('open')
    chevron.classList.replace('fa-chevron-up', 'fa-chevron-down')
    if (metricsInterval) { clearInterval(metricsInterval); metricsInterval = null }
  }
}

function initMonitor() {
  monitorOpen = localStorage.getItem('pulse_monitor_expanded') === '1'
  if (monitorOpen) {
    document.getElementById('monitor-body').classList.add('open')
    document.getElementById('monitor-chevron').classList.replace('fa-chevron-down', 'fa-chevron-up')
    startMetrics()
  }
}

// ── Live metrics ──
function fmtBytes(b) {
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB/s'
  if (b >= 1024)    return (b / 1024).toFixed(0) + ' KB/s'
  return b + ' B/s'
}

function startMetrics() {
  if (metricsInterval) clearInterval(metricsInterval)
  metricsInterval = setInterval(async () => {
    if (!monitorOpen) return
    const m = await api.getMetrics()
    if (!m) return
    const cpu = m.cpu ?? 0, ram = m.ram ?? 0, gpu = m.gpu ?? 0
    set('cpu-val', `${cpu}%`); set('cpu-bar', null, cpu)
    set('ram-val', `${ram}%`); set('ram-bar', null, ram)
    set('gpu-val', `${gpu}%`); set('gpu-bar', null, gpu)
    const cpuT = m.cpuTemp > 0 ? `${m.cpuTemp}°C` : ''
    const gpuT = m.gpuTemp > 0 ? `${m.gpuTemp}°C` : ''
    set('cpu-temp-val', cpuT)
    set('gpu-temp-val', gpuT)
    if (m.ramUsed && m.ramTotal) set('ram-detail', `${m.ramUsed} / ${m.ramTotal} GB`)
    const nd = m.netDown > 0 ? `↓ ${fmtBytes(m.netDown)}` : '↓ —'
    const nu = m.netUp   > 0 ? `↑ ${fmtBytes(m.netUp)}`   : '↑ —'
    set('net-val', `${nd}  ${nu}`)
    _sparkCpu.push(cpu); if (_sparkCpu.length > SPARK_LEN) _sparkCpu.shift()
    _sparkGpu.push(gpu); if (_sparkGpu.length > SPARK_LEN) _sparkGpu.shift()
    drawMonitorSpark()
  }, 2000)
}

function drawMonitorSpark() {
  const canvas = document.getElementById('monitor-spark')
  if (!canvas) return
  const W = canvas.offsetWidth, H = canvas.offsetHeight
  if (!W || !H) return
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')
  ctx.clearRect(0, 0, W, H)
  function drawLine(data, color) {
    if (data.length < 2) return
    const max = 100, step = W / (SPARK_LEN - 1)
    ctx.beginPath()
    ctx.strokeStyle = color
    ctx.lineWidth = 1.5
    ctx.lineJoin = 'round'
    data.forEach((v, i) => {
      const x = i * step, y = H - (v / max) * H
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)
    })
    ctx.stroke()
  }
  drawLine(_sparkGpu, getComputedStyle(document.documentElement).getPropertyValue('--gpu-color').trim() || '#00D4B4')
  drawLine(_sparkCpu, getComputedStyle(document.documentElement).getPropertyValue('--cpu-color').trim() || '#FF4C7A')
}

function set(id, text, pct) {
  const el = document.getElementById(id)
  if (!el) return
  if (text !== null && text !== undefined) el.textContent = text
  if (pct !== null && pct !== undefined) el.style.width = `${pct}%`
}

// ── Process table ──
async function loadProcs(btn) {
  if (btn) { btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>'; btn.disabled = true }
  const procs = await api.getProcesses()
  procData = Array.isArray(procs) ? procs : []
  if (btn) { btn.innerHTML = `<i class="fa fa-arrows-rotate"></i> ${tP('refresh')}`; btn.disabled = false }
  renderProcs(procData)
  const el = document.getElementById('proc-count')
  if (el) el.textContent = `${procData.length}`
}

function sortProcs(key) {
  if (procSort.key === key) procSort.dir *= -1
  else { procSort.key = key; procSort.dir = -1 }
  renderProcs(procData)
}

function filterProcs(val) {
  const q = val.toLowerCase()
  renderProcs(q ? procData.filter(p => p.Name?.toLowerCase().includes(q)) : procData)
}

function renderProcs(data) {
  const tbody = document.getElementById('proc-tbody')
  if (!tbody) return
  const sorted = [...data].sort((a, b) => {
    const va = procSort.key === 'name' ? (a.Name||'') : procSort.key === 'cpu' ? (a.CPU||0) : (a.RAM||0)
    const vb = procSort.key === 'name' ? (b.Name||'') : procSort.key === 'cpu' ? (b.CPU||0) : (b.RAM||0)
    return procSort.key === 'name' ? va.localeCompare(vb) * procSort.dir : (va - vb) * procSort.dir
  })
  const maxRam = Math.max(...sorted.map(p => p.RAM||0), 1)
  const maxCpu = Math.max(...sorted.map(p => p.CPU||0), 1)
  tbody.innerHTML = sorted.slice(0, 80).map(p => {
    const rp = Math.round((p.RAM||0) / maxRam * 100)
    const cp = Math.min(100, Math.round((p.CPU||0) / maxCpu * 100))
    const rc = rp > 70 ? 'var(--danger)' : rp > 40 ? 'var(--warning)' : 'var(--info)'
    return `<tr>
      <td>${p.Name||'?'}</td>
      <td>
        <div class="bar-wrap"><div class="bar-fill" style="width:${cp}%;background:var(--cpu-color)"></div></div>
        <div style="font-size:0.7rem;color:var(--text-dim)">${p.CPU||0}%</div>
      </td>
      <td>
        <div class="bar-wrap"><div class="bar-fill" style="width:${rp}%;background:${rc}"></div></div>
        <div style="font-size:0.7rem;color:var(--text-dim)">${(p.RAM||0).toFixed(0)} MB</div>
      </td>
      <td style="font-size:0.7rem;color:var(--text-dim)">${p.Id||'?'}</td>
      <td><button class="kill-btn" onclick="doKill(${p.Id},'${p.Name}')"><i class="fa fa-xmark"></i></button></td>
    </tr>`
  }).join('')
}

async function doKill(pid, name) {
  if (!confirm(tP('killConfirm').replace('{name}', name).replace('{pid}', pid))) return
  const r = await api.killProcess(pid)
  showToast(r.ok ? `${tP('killed')} ${name}` : tP('failed'), r.ok ? 'ok' : 'err')
  loadProcs()
}

// ── Toast ──
let _toastTimer = null
function showToast(msg, type) {
  const el = document.getElementById('toast')
  const colors = { ok: 'var(--ok)', err: 'var(--danger)', info: 'var(--info)' }
  el.style.borderLeftWidth = '3px'
  el.style.borderLeftColor = colors[type] || 'var(--border-active)'
  el.textContent = msg
  el.style.display = 'block'
  if (_toastTimer) clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => { el.style.display = 'none' }, 2500)
}

// ── Window controls ──
function closePulseWindow() {
  if (pulseActive) {
    if (!confirm(tP('stopConfirm'))) return
    api.pulseStop()
  }
  api.closePulseWindow()
}

init()
</script>
