<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boot stage demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/ui.css">
<style>
  body { margin: 0; background: var(--c-bg-base, #09090b); color: var(--c-text-primary); font: 13px var(--font, system-ui); }
  #home { position: fixed; inset: 0; padding: 32px 32px 32px 220px; }
  #home-stage { position: relative; width: 100%; height: 60vh; border: 1px solid var(--hairline); border-radius: var(--r-lg); overflow: hidden; }
</style>
</head>
<body>
<!-- Query: ?q=auto|off (3D setting)  &speed=1 (timeline multiplier)  &motion=reduced  &fast=1 (all steps at once)  &noskip -->
<div id="home"><div id="home-stage"><div class="j-twin-slot" id="home-twin-slot" data-twin-view="rig:home"></div></div></div>
<div id="loading">
  <div class="boot-header"><div class="boot-logo-icon"><i class="fa fa-bolt"></i></div><div class="boot-logo-text-wrap"><div class="boot-logo-name">Jylli Tool</div><div class="boot-logo-ver">v1.6.0</div></div></div>
  <div class="boot-stage j-twin-slot" id="boot-twin-slot" role="img" aria-label="Your PC being identified"></div>
  <svg class="boot-leaders" id="boot-leaders" aria-hidden="true"></svg>
  <div class="boot-center">
    <div class="boot-tagline">Scanning your system</div>
    <div class="boot-rows load-steps" id="rows"></div>
    <button class="j-link boot-skip" id="boot-skip" type="button">Skip</button>
  </div>
  <div class="boot-footer"><div class="boot-progress-track"><div class="boot-progress-fill" id="boot-progress-fill"></div></div></div>
</div>
<script>
  const qs = new URLSearchParams(location.search)
  window.JYLLI_TWIN_BUNDLE = '../../js/vendor/three.bundle.js'
  window.settings = { visuals3d: qs.get('q') || 'auto' }
  if (qs.get('motion') === 'reduced') document.body.classList.add('motion-reduced')
  window.tUI = k => ({ twinAria: 'PC', bootStageAria: 'Your PC being identified' }[k] || k)
  window.api = {
    getHardwareInventory: async () => {
      const raw = await (await fetch('../../test/fixtures/sensors/inventory-raw-desktop.json')).json()
      const src = await (await fetch('../../lib/inventory.js')).text()
      const m = { exports: {} }; new Function('module', 'exports', 'require', src)(m, m.exports, () => ({}))
      if (qs.get('form') === 'laptop') raw.chassis = [10]
      return { ok: true, rig: m.exports.buildRigSpec(raw, {}) }
    },
    telemetrySubscribe: async () => ({}), telemetryUnsubscribe() {}, telemetryCapabilities: async () => ({ capabilities: {} }), onTwinTelemetry: () => () => {},
  }
</script>
<script src="../../js/telemetry.js"></script>
<script src="../../js/twin/layout.js"></script>
<script src="../../js/twin/mapping.js"></script>
<script src="../../js/twin/motion.js"></script>
<script src="../../js/twin/fallback.js"></script>
<script src="../../js/twin/kit.js"></script>
<script src="../../js/twin/engine.js"></script>
<script src="../../js/twin/host.js"></script>
<script src="../../js/boot-stage.js"></script>
<script>
  // Same row ids/structure as index.html; the timeline stands in for the detection events.
  const STEPS = [['cpu', 'CPU', 'AMD Ryzen 7 7800X3D · 4.2 GHz', 900], ['ram', 'RAM', '32 GB · 6000 MHz', 700], ['gpu', 'GPU', 'NVIDIA GeForce RTX 5070', 1100], ['vram', 'VRAM', '12GB VRAM', 500], ['storage', 'Storage', 'NVMe SSD · 234/512 GB', 800], ['os', 'OS & Admin', 'Running as Administrator', 1000]]
  const speed = Number(qs.get('speed')) || 1, fast = qs.get('fast')
  const rows = document.getElementById('rows')
  rows.innerHTML = STEPS.map(([id, label]) => `<div class="boot-row load-step" id="lstep-${id}"><div class="boot-row-left"><span class="boot-row-icon step-icon"></span><span class="boot-row-label step-label">${label}</span></div><div class="boot-row-right step-detail-wrap"><span class="step-detail"></span></div></div>`).join('')
  const wait = ms => new Promise(r => setTimeout(r, ms))
  ;(async () => {
    JylliBootStage.start()
    await wait(600 / speed)
    for (let i = 0; i < STEPS.length; i++) {
      const [id, , detail, ms] = STEPS[i], row = document.getElementById('lstep-' + id)
      JylliBootStage.onStepActive(id); row.classList.add('active')
      await wait(fast ? 0 : ms / speed)
      JylliBootStage.onStepDone(id); row.classList.remove('active'); row.classList.add('done')
      row.querySelector('.step-detail').textContent = detail
      document.getElementById('boot-progress-fill').style.width = ((i + 1) / STEPS.length * 100) + '%'
    }
    await wait(300)
    if (qs.has('hold')) return                       // ?hold: stay on the finished boot screen (screenshots)
    JylliTwin.attach(document.getElementById('home-twin-slot'))   // Home renders right after the scan, like index.html
    await JylliBootStage.finish()
    document.getElementById('loading').style.display = 'none'
    document.title = 'boot done · canvases: ' + document.querySelectorAll('canvas').length + ' · ' + JylliTwin.state
  })()
</script>
</body>
</html>
