<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ui.css">
<style>
  body { margin: 0; padding: 16px; background: var(--c-bg, #09090b); color: var(--twin-text); font: 13px var(--font, system-ui); }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .stage { width: 760px; height: 420px; position: relative; }
  .panel { display: grid; gap: 8px; min-width: 260px; }
  label { display: grid; grid-template-columns: 120px 1fr 48px; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="row">
  <div class="j-twin-stage stage" id="stage"><div id="slot"></div></div>
  <div class="panel">
    <label>Adapters <input type="range" id="n" min="0" max="3" value="1"><span id="nv">1</span></label>
    <label>Rx KB/s <input type="range" id="rx" min="0" max="2000" value="400"><span id="rxv">400</span></label>
    <label>Tx KB/s <input type="range" id="tx" min="0" max="2000" value="120"><span id="txv">120</span></label>
  </div>
</div>
<script src="../../js/twin/kit.js"></script>
<script src="../../js/twin/netscene.js"></script>
<script>
  window.JYLLI_TWIN_BUNDLE = '../../js/vendor/three.bundle.js'
  const $ = id => document.getElementById(id)
  let scene = null
  JylliTwinNet.create($('slot'), { accent: [0.55, 0.49, 0.96] }).then(s => {
    scene = s
    if (!s) { document.body.insertAdjacentHTML('beforeend', '<p style="color:#f88">No WebGL</p>'); return }
    const resize = () => { const r = $('stage').getBoundingClientRect(); s.resize(Math.round(r.width), Math.round(r.height), devicePixelRatio || 1) }
    resize(); window.addEventListener('resize', resize)
    push()
  })
  function push() {
    if (!scene) return
    const n = +$('n').value, rx = +$('rx').value * 1024, tx = +$('tx').value * 1024
    $('nv').textContent = n; $('rxv').textContent = $('rx').value; $('txv').textContent = $('tx').value
    const levels = Array.from({ length: n }, () => ({ rx: rx || null, tx: tx || null }))
    scene.setTraffic(levels.length ? levels : [{ rx: null, tx: null }])
  }
  for (const id of ['n', 'rx', 'tx']) $(id).oninput = push
</script>
</body>
</html>
